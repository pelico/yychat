<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>记忆翻牌</title>
<meta name="game-icon" content="🃏">
<meta name="game-desc" content="翻牌配对，锻炼记忆">
<meta name="game-tag" content="记忆">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.info-bar{display:flex;gap:clamp(12px,3vw,24px);justify-content:center;padding:8px 0;font-size:clamp(14px,2.5vw,20px);flex-shrink:0}
.info-bar span{color:rgba(255,255,255,.7)}
.info-bar .val{color:#4ecca3;font-weight:bold}
#gameGrid{display:flex;flex-wrap:wrap;gap:clamp(4px,1vw,10px);padding:clamp(4px,1vw,8px);max-width:94vw;max-height:72vh;flex-shrink:0}
.card{position:relative;box-sizing:border-box;border-radius:clamp(6px,1.5vw,12px);cursor:pointer;perspective:600px;-webkit-tap-highlight-color:transparent;aspect-ratio:1}
.card-inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.card-face{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:clamp(6px,1.5vw,12px);display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card-back{background:linear-gradient(135deg,#2d3561,#1a1a2e);border:2px solid rgba(78,204,163,.3);font-size:clamp(16px,3vw,28px);color:rgba(78,204,163,.5)}
.card-front{background:linear-gradient(135deg,#16213e,#0f3460);border:2px solid rgba(78,204,163,.5);transform:rotateY(180deg);-webkit-transform:rotateY(180deg);font-size:clamp(24px,5vw,48px)}
.card.cursor .card-back{border-color:#4ecca3;box-shadow:0 0 12px rgba(78,204,163,.4)}
.card.matched .card-front{border-color:#ffd700;box-shadow:0 0 16px rgba(255,215,0,.3);background:linear-gradient(135deg,#1a3a2e,#0f3430)}
.card.wrong .card-front{border-color:#e74c3c;box-shadow:0 0 12px rgba(231,76,60,.3)}
.controls{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;width:min(36vw,160px);height:min(36vw,160px);margin-top:1vh;flex-shrink:0}
.ctrl-btn{min-width:44px;min-height:44px;border:2px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;font-size:clamp(14px,2.5vw,22px);cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ctrl-btn:active{background:rgba(78,204,163,.3);border-color:#4ecca3}
.ctrl-btn.empty{visibility:hidden;border:none;background:none}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px}
.overlay.hidden{display:none}
.overlay h1{font-size:clamp(26px,5vw,44px);margin-bottom:10px;text-shadow:0 0 20px rgba(78,204,163,.5)}
.overlay p{font-size:clamp(14px,2.5vw,20px);color:rgba(255,255,255,.7);margin-bottom:6px}
.diff-row{display:flex;gap:12px;margin:14px 0}
.diff-item{padding:10px 20px;border:2px solid rgba(255,255,255,.2);border-radius:10px;font-size:clamp(14px,2.5vw,20px);transition:all .2s}
.diff-item.active{border-color:#4ecca3;background:rgba(78,204,163,.2);color:#4ecca3;font-weight:bold}
.hint{font-size:clamp(13px,2vw,18px);color:rgba(255,255,255,.5);margin-top:12px}
.win-emoji{font-size:clamp(40px,8vw,64px);margin-bottom:8px}
</style>
</head>
<body>
<div class="info-bar" id="infoBar" style="visibility:hidden">
  <span>步数: <span class="val" id="moveCount">0</span></span>
  <span>配对: <span class="val" id="pairCount">0/0</span></span>
  <span>⏱ <span class="val" id="timerDisplay">0秒</span></span>
</div>
<div id="gameGrid"></div>

<div class="controls" id="touchControls">
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="up">▲</button>
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="left">◀</button>
  <button class="ctrl-btn" data-action="flip" style="font-size:clamp(12px,2vw,16px)">翻</button>
  <button class="ctrl-btn" data-dir="right">▶</button>
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="down">▼</button>
  <div class="ctrl-btn empty"></div>
</div>

<div class="overlay" id="overlay">
  <h1 id="olTitle">🧠 记忆翻牌</h1>
  <p id="olSub">选择难度，按回车开始</p>
  <div class="diff-row" id="diffRow">
    <div class="diff-item" data-diff="0">简单</div>
    <div class="diff-item active" data-diff="1">普通</div>
    <div class="diff-item" data-diff="2">困难</div>
  </div>
  <p class="hint" id="olHint">← → 切换难度 · 回车 开始</p>
</div>

<script>
(function(){
  var grid = document.getElementById('gameGrid');
  var overlay = document.getElementById('overlay');
  var olTitle = document.getElementById('olTitle');
  var olSub = document.getElementById('olSub');
  var olHint = document.getElementById('olHint');
  var diffRow = document.getElementById('diffRow');
  var diffItems = diffRow.querySelectorAll('.diff-item');
  var infoBar = document.getElementById('infoBar');
  var moveCountEl = document.getElementById('moveCount');
  var pairCountEl = document.getElementById('pairCount');
  var timerEl = document.getElementById('timerDisplay');

  var EMOJIS = ['🐶','🐱','🐼','🦊','🐸','🐵','🐰','🐷','🦁','🐯','🐨','🐮'];
  var DIFFS = [
    {name:'简单', pairs:4, gridCols:4, gridRows:2},
    {name:'普通', pairs:8, gridCols:4, gridRows:4},
    {name:'困难', pairs:12, gridCols:6, gridRows:4}
  ];

  var state = 'menu';
  var diffIdx = 1;
  var cards = [];
  var cursorR = 0, cursorC = 0;
  var gridRows, gridCols;
  var flipped = []; // indices of currently flipped (non-matched) cards
  var matched = 0, totalPairs = 0;
  var moves = 0;
  var locked = false;
  var startTime, elapsed, timerRAF;

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function startGame() {
    var diff = DIFFS[diffIdx];
    gridRows = diff.gridRows;
    gridCols = diff.gridCols;
    totalPairs = diff.pairs;
    matched = 0; moves = 0; locked = false;
    flipped = [];
    cursorR = 0; cursorC = 0;

    // Create card pairs
    var emojis = EMOJIS.slice(0, totalPairs);
    var deck = shuffle(emojis.concat(emojis));

    // Build grid
    cards = [];
    grid.innerHTML = '';

    // Calculate card size
    var maxW = window.innerWidth * 0.92;
    var maxH = window.innerHeight * 0.62;
    var cardW = Math.floor((maxW - (gridCols - 1) * 6) / gridCols);
    var cardH = Math.floor((maxH - (gridRows - 1) * 6) / gridRows);
    var sz = Math.min(cardW, cardH, 120);

    for (var i = 0; i < deck.length; i++) {
      var card = document.createElement('div');
      card.className = 'card';
      card.style.width = (100 / gridCols) + '%';
      card.style.height = sz + 'px';
      card.setAttribute('data-idx', i);
      card.innerHTML = '<div class="card-inner"><div class="card-face card-back">?</div><div class="card-face card-front">' + deck[i] + '</div></div>';
      grid.appendChild(card);
      cards.push({el:card, emoji:deck[i], flipped:false, matched:false});

      // Touch to flip
      (function(idx){
        card.addEventListener('touchstart', function(e){
          e.preventDefault();
          if (state !== 'playing' || locked) return;
          cursorR = Math.floor(idx / gridCols);
          cursorC = idx % gridCols;
          updateCursor();
          flipCard(idx);
        }, {passive:false});
        card.addEventListener('click', function(){
          if (state !== 'playing' || locked) return;
          cursorR = Math.floor(idx / gridCols);
          cursorC = idx % gridCols;
          updateCursor();
          flipCard(idx);
        });
      })(i);
    }

    updateCursor();
    moveCountEl.textContent = '0';
    pairCountEl.textContent = '0/' + totalPairs;
    infoBar.style.visibility = 'visible';
    overlay.classList.add('hidden');
    state = 'playing';

    startTime = Date.now();
    elapsed = 0;
    function tick() {
      if (state !== 'playing') return;
      elapsed = Math.floor((Date.now() - startTime) / 1000);
      timerEl.textContent = formatTime(elapsed);
      timerRAF = requestAnimationFrame(tick);
    }
    timerRAF = requestAnimationFrame(tick);
  }

  function formatTime(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m > 0 ? m + '分' + sec + '秒' : sec + '秒';
  }

  function updateCursor() {
    cards.forEach(function(c, i) {
      var r = Math.floor(i / gridCols);
      var cc = i % gridCols;
      c.el.classList.toggle('cursor', r === cursorR && cc === cursorC && !c.matched);
    });
  }

  function flipCard(idx) {
    var card = cards[idx];
    if (!card || card.flipped || card.matched || locked) return;
    if (flipped.length >= 2) return;

    card.flipped = true;
    card.el.classList.add('flipped');
    flipped.push(idx);

    if (flipped.length === 2) {
      moves++;
      moveCountEl.textContent = moves;
      locked = true;
      var a = flipped[0], b = flipped[1];
      if (cards[a].emoji === cards[b].emoji) {
        // Match!
        setTimeout(function(){
          cards[a].matched = true;
          cards[b].matched = true;
          cards[a].el.classList.add('matched');
          cards[b].el.classList.add('matched');
          matched++;
          pairCountEl.textContent = matched + '/' + totalPairs;
          flipped = [];
          locked = false;
          if (matched === totalPairs) {
            state = 'win';
            cancelAnimationFrame(timerRAF);
            showWin();
          }
        }, 400);
      } else {
        // No match
        cards[a].el.classList.add('wrong');
        cards[b].el.classList.add('wrong');
        setTimeout(function(){
          cards[a].flipped = false;
          cards[b].flipped = false;
          cards[a].el.classList.remove('flipped', 'wrong');
          cards[b].el.classList.remove('flipped', 'wrong');
          flipped = [];
          locked = false;
        }, 800);
      }
    }
  }

  function showWin() {
    olTitle.innerHTML = '<span class="win-emoji">🎉</span><br>全部找到！';
    olSub.textContent = '用了 ' + moves + ' 步，耗时 ' + formatTime(elapsed);
    olHint.textContent = '回车 再来一局 · 空格 换难度';
    diffRow.style.display = 'none';
    infoBar.style.visibility = 'hidden';
    overlay.classList.remove('hidden');
  }

  function showMenu() {
    state = 'menu';
    cancelAnimationFrame(timerRAF);
    olTitle.textContent = '🧠 记忆翻牌';
    olSub.textContent = '选择难度，按回车开始';
    olHint.textContent = '← → 切换难度 · 回车 开始';
    diffRow.style.display = 'flex';
    infoBar.style.visibility = 'hidden';
    updateDiffUI();
    overlay.classList.remove('hidden');
  }

  function updateDiffUI() {
    diffItems.forEach(function(item, i) {
      item.classList.toggle('active', i === diffIdx);
    });
  }

  // --- Input ---
  document.addEventListener('keydown', function(e) {
    var key = e.key;

    if (state === 'menu') {
      if (key === 'ArrowLeft' || key === 'ArrowRight') {
        e.preventDefault();
        if (key === 'ArrowLeft') diffIdx = Math.max(0, diffIdx - 1);
        else diffIdx = Math.min(DIFFS.length - 1, diffIdx + 1);
        updateDiffUI();
      } else if (key === 'Enter' || key === ' ') {
        e.preventDefault();
        startGame();
      }
      return;
    }

    if (state === 'playing') {
      if (key === 'ArrowUp' || key === 'w' || key === 'W') {
        e.preventDefault();
        cursorR = Math.max(0, cursorR - 1);
        updateCursor();
      } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
        e.preventDefault();
        cursorR = Math.min(gridRows - 1, cursorR + 1);
        updateCursor();
      } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
        e.preventDefault();
        cursorC = Math.max(0, cursorC - 1);
        updateCursor();
      } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
        e.preventDefault();
        cursorC = Math.min(gridCols - 1, cursorC + 1);
        updateCursor();
      } else if (key === 'Enter' || key === ' ') {
        e.preventDefault();
        var idx = cursorR * gridCols + cursorC;
        flipCard(idx);
      }
      return;
    }

    if (state === 'win') {
      if (key === 'Enter') { e.preventDefault(); startGame(); }
      else if (key === ' ') { e.preventDefault(); showMenu(); }
      return;
    }
  });

  // Touch controls
  document.querySelectorAll('.ctrl-btn[data-dir]').forEach(function(btn) {
    function handleDir(ev) {
      ev.preventDefault();
      if (state !== 'playing') return;
      var dir = btn.getAttribute('data-dir');
      if (dir === 'up') cursorR = Math.max(0, cursorR - 1);
      else if (dir === 'down') cursorR = Math.min(gridRows - 1, cursorR + 1);
      else if (dir === 'left') cursorC = Math.max(0, cursorC - 1);
      else if (dir === 'right') cursorC = Math.min(gridCols - 1, cursorC + 1);
      updateCursor();
    }
    btn.addEventListener('touchstart', handleDir, {passive:false});
    btn.addEventListener('mousedown', handleDir);
  });

  var flipBtn = document.querySelector('.ctrl-btn[data-action="flip"]');
  if (flipBtn) {
    function handleFlip(ev) {
      ev.preventDefault();
      if (state !== 'playing') return;
      var idx = cursorR * gridCols + cursorC;
      flipCard(idx);
    }
    flipBtn.addEventListener('touchstart', handleFlip, {passive:false});
    flipBtn.addEventListener('mousedown', handleFlip);
  }

  // Touch overlay
  overlay.addEventListener('touchstart', function(e) {
    if (state === 'menu') {
      var target = e.target;
      if (target.classList.contains('diff-item')) {
        diffIdx = parseInt(target.getAttribute('data-diff'));
        updateDiffUI();
        return;
      }
      e.preventDefault();
      startGame();
    } else if (state === 'win') {
      e.preventDefault();
      startGame();
    }
  }, {passive:false});

  // Resize
  window.addEventListener('resize', function() {
    if (state === 'playing' && cards.length > 0) {
      var maxW = window.innerWidth * 0.92;
      var maxH = window.innerHeight * 0.62;
      var cardW = Math.floor((maxW - (gridCols - 1) * 6) / gridCols);
      var cardH = Math.floor((maxH - (gridRows - 1) * 6) / gridRows);
      var sz = Math.min(cardW, cardH, 120);
      cards.forEach(function(c) {
        c.el.style.width = sz + 'px';
        c.el.style.height = sz + 'px';
      });
    }
  });

  showMenu();
})();
</script>
</body>
</html>

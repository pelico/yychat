<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>走迷宫</title>
<meta name="game-icon" content="🏰">
<meta name="game-desc" content="找到出口，3种难度">
<meta name="game-tag" content="益智">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gameCanvas{border:2px solid #4ecca3;border-radius:8px;background:#16213e;display:block}
.controls{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;width:min(40vw,180px);height:min(40vw,180px);margin-top:1vh;flex-shrink:0}
.ctrl-btn{min-width:44px;min-height:44px;border:2px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;font-size:clamp(16px,3vw,24px);cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ctrl-btn:active{background:rgba(78,204,163,.3);border-color:#4ecca3}
.ctrl-btn.empty{visibility:hidden;border:none;background:none}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px}
.overlay.hidden{display:none}
.overlay h1{font-size:clamp(28px,5vw,48px);margin-bottom:12px;text-shadow:0 0 20px rgba(78,204,163,.5)}
.overlay h2{font-size:clamp(22px,4vw,36px);margin-bottom:10px}
.overlay p{font-size:clamp(14px,2.5vw,20px);color:rgba(255,255,255,.7);margin-bottom:6px}
.diff-row{display:flex;gap:12px;margin:16px 0}
.diff-item{padding:10px 20px;border:2px solid rgba(255,255,255,.2);border-radius:10px;font-size:clamp(14px,2.5vw,20px);transition:all .2s}
.diff-item.active{border-color:#4ecca3;background:rgba(78,204,163,.2);color:#4ecca3;font-weight:bold}
.hint{font-size:clamp(13px,2vw,18px);color:rgba(255,255,255,.5);margin-top:14px}
.timer{font-size:clamp(16px,2.5vw,24px);color:#4ecca3;margin:8px 0}
.win-emoji{font-size:clamp(40px,8vw,72px);margin-bottom:8px}
@media(max-height:500px){.controls{width:100px;height:100px}}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div class="controls" id="touchControls">
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="up">▲</button>
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="left">◀</button>
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="right">▶</button>
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="down">▼</button>
  <div class="ctrl-btn empty"></div>
</div>

<div class="overlay" id="overlay">
  <h1 id="olTitle">🏰 走迷宫</h1>
  <p id="olSub">选择难度，按回车开始</p>
  <div class="diff-row" id="diffRow">
    <div class="diff-item" data-diff="0">简单</div>
    <div class="diff-item active" data-diff="1">普通</div>
    <div class="diff-item" data-diff="2">困难</div>
  </div>
  <div class="timer" id="olTimer" style="display:none"></div>
  <p class="hint" id="olHint">← → 切换难度 · 回车 开始</p>
</div>

<script>
(function(){
  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var olTitle = document.getElementById('olTitle');
  var olSub = document.getElementById('olSub');
  var olTimer = document.getElementById('olTimer');
  var olHint = document.getElementById('olHint');
  var diffRow = document.getElementById('diffRow');
  var diffItems = diffRow.querySelectorAll('.diff-item');

  var DIFFS = [
    {name:'简单', cols:8, rows:8},
    {name:'普通', cols:12, rows:12},
    {name:'困难', cols:16, rows:16}
  ];

  var state = 'menu'; // menu, playing, paused, win
  var diffIdx = 1;
  var maze = [];
  var cols, rows, cellSize;
  var playerR, playerC;
  var goalR, goalC;
  var startTime, elapsed, timerRAF;
  var moveCount = 0;

  // --- Maze Generation (Recursive Backtracker) ---
  function generateMaze(c, r) {
    var grid = [];
    for (var i = 0; i < r; i++) {
      grid[i] = [];
      for (var j = 0; j < c; j++) {
        grid[i][j] = { top:true, right:true, bottom:true, left:true, visited:false };
      }
    }
    var stack = [];
    var cr = 0, cc = 0;
    grid[cr][cc].visited = true;
    stack.push({r:cr, c:cc});

    while (stack.length > 0) {
      var neighbors = [];
      var dirs = [
        {dr:-1,dc:0,wall:'top',opp:'bottom'},
        {dr:1,dc:0,wall:'bottom',opp:'top'},
        {dr:0,dc:-1,wall:'left',opp:'right'},
        {dr:0,dc:1,wall:'right',opp:'left'}
      ];
      for (var d = 0; d < 4; d++) {
        var nr = cr + dirs[d].dr;
        var nc = cc + dirs[d].dc;
        if (nr >= 0 && nr < r && nc >= 0 && nc < c && !grid[nr][nc].visited) {
          neighbors.push({r:nr, c:nc, wall:dirs[d].wall, opp:dirs[d].opp});
        }
      }
      if (neighbors.length > 0) {
        var pick = neighbors[Math.floor(Math.random() * neighbors.length)];
        grid[cr][cc][pick.wall] = false;
        grid[pick.r][pick.c][pick.opp] = false;
        grid[pick.r][pick.c].visited = true;
        stack.push({r:cr, c:cc});
        cr = pick.r;
        cc = pick.c;
      } else {
        var prev = stack.pop();
        cr = prev.r;
        cc = prev.c;
      }
    }
    return grid;
  }

  // --- Sizing ---
  function resize() {
    var controlsEl = document.getElementById('touchControls');
    var ctrlH = controlsEl ? controlsEl.offsetHeight : 0;
    var availW = window.innerWidth * 0.92;
    var availH = (window.innerHeight - ctrlH) * 0.82;
    cellSize = Math.floor(Math.min(availW / cols, availH / rows));
    if (cellSize < 12) cellSize = 12;
    canvas.width = cellSize * cols;
    canvas.height = cellSize * rows;
    canvas.style.maxWidth = availW + 'px';
    canvas.style.maxHeight = availH + 'px';
  }

  // --- Drawing ---
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw cells (carve passages)
    ctx.fillStyle = '#16213e';
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var x = c * cellSize;
        var y = r * cellSize;
        var inset = Math.max(1, Math.floor(cellSize * 0.1));
        ctx.fillRect(x + inset, y + inset, cellSize - inset * 2, cellSize - inset * 2);
      }
    }

    // Draw walls
    ctx.strokeStyle = '#4ecca3';
    ctx.lineWidth = Math.max(1, Math.floor(cellSize * 0.08));
    ctx.lineCap = 'round';
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var cell = maze[r][c];
        var x = c * cellSize;
        var y = r * cellSize;
        ctx.beginPath();
        if (cell.top) { ctx.moveTo(x, y); ctx.lineTo(x + cellSize, y); }
        if (cell.right) { ctx.moveTo(x + cellSize, y); ctx.lineTo(x + cellSize, y + cellSize); }
        if (cell.bottom) { ctx.moveTo(x, y + cellSize); ctx.lineTo(x + cellSize, y + cellSize); }
        if (cell.left) { ctx.moveTo(x, y); ctx.lineTo(x, y + cellSize); }
        ctx.stroke();
      }
    }

    // Draw visited trail (subtle)
    ctx.fillStyle = 'rgba(78,204,163,0.06)';
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if (maze[r][c].visited && !(r === playerR && c === playerC)) {
          var x = c * cellSize;
          var y = r * cellSize;
          var pad = Math.max(2, Math.floor(cellSize * 0.15));
          ctx.fillRect(x + pad, y + pad, cellSize - pad*2, cellSize - pad*2);
        }
      }
    }

    // Draw goal
    var gx = goalC * cellSize + cellSize / 2;
    var gy = goalR * cellSize + cellSize / 2;
    var gr = cellSize * 0.35;
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = cellSize * 0.4;
    ctx.beginPath();
    drawStar(gx, gy, 5, gr, gr * 0.5);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Draw player
    var px = playerC * cellSize + cellSize / 2;
    var py = playerR * cellSize + cellSize / 2;
    var pr = cellSize * 0.32;
    ctx.fillStyle = '#e74c3c';
    ctx.shadowColor = '#e74c3c';
    ctx.shadowBlur = cellSize * 0.3;
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Player eyes
    ctx.fillStyle = '#fff';
    var eyeR = pr * 0.22;
    var eyeOff = pr * 0.3;
    ctx.beginPath();
    ctx.arc(px - eyeOff, py - eyeOff * 0.3, eyeR, 0, Math.PI * 2);
    ctx.arc(px + eyeOff, py - eyeOff * 0.3, eyeR, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStar(cx, cy, spikes, outerR, innerR) {
    var rot = Math.PI / 2 * 3;
    var step = Math.PI / spikes;
    ctx.moveTo(cx, cy - outerR);
    for (var i = 0; i < spikes; i++) {
      ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
      rot += step;
      ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerR);
    ctx.closePath();
  }

  // --- Timer ---
  function startTimer() {
    startTime = Date.now();
    elapsed = 0;
    function tick() {
      if (state !== 'playing') return;
      elapsed = Math.floor((Date.now() - startTime) / 1000);
      olTimer.textContent = '⏱ ' + formatTime(elapsed);
      timerRAF = requestAnimationFrame(tick);
    }
    timerRAF = requestAnimationFrame(tick);
  }

  function formatTime(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m > 0 ? m + '分' + sec + '秒' : sec + '秒';
  }

  // --- Game Logic ---
  function startGame() {
    var diff = DIFFS[diffIdx];
    cols = diff.cols;
    rows = diff.rows;
    maze = generateMaze(cols, rows);
    playerR = 0;
    playerC = 0;
    goalR = rows - 1;
    goalC = cols - 1;
    moveCount = 0;
    // Reset visited flags for trail (keep start as visited)
    for (var r = 0; r < rows; r++)
      for (var c = 0; c < cols; c++)
        maze[r][c].visited = false;
    maze[0][0].visited = true;

    resize();
    draw();
    state = 'playing';
    overlay.classList.add('hidden');
    startTimer();
  }

  function movePlayer(dr, dc) {
    if (state !== 'playing') return;
    var cell = maze[playerR][playerC];
    // Check wall
    if (dr === -1 && cell.top) return;
    if (dr === 1 && cell.bottom) return;
    if (dc === -1 && cell.left) return;
    if (dc === 1 && cell.right) return;
    var nr = playerR + dr;
    var nc = playerC + dc;
    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) return;
    playerR = nr;
    playerC = nc;
    maze[playerR][playerC].visited = true;
    moveCount++;
    draw();
    // Check win
    if (playerR === goalR && playerC === goalC) {
      state = 'win';
      cancelAnimationFrame(timerRAF);
      showWin();
    }
  }

  function showWin() {
    olTitle.textContent = '🎉 恭喜过关！';
    olSub.textContent = '用了 ' + formatTime(elapsed) + '，走了 ' + moveCount + ' 步';
    olTimer.style.display = 'none';
    olHint.textContent = '回车 再来一局 · 空格 换难度';
    diffRow.style.display = 'none';
    overlay.classList.remove('hidden');
  }

  function showPause() {
    state = 'paused';
    cancelAnimationFrame(timerRAF);
    olTitle.textContent = '⏸ 暂停中';
    olSub.textContent = '已用时 ' + formatTime(elapsed);
    olTimer.style.display = 'none';
    olHint.textContent = '空格 继续 · 回车 重新开始';
    diffRow.style.display = 'none';
    overlay.classList.remove('hidden');
  }

  function showMenu() {
    state = 'menu';
    cancelAnimationFrame(timerRAF);
    olTitle.textContent = '🏰 走迷宫';
    olSub.textContent = '选择难度，按回车开始';
    olTimer.style.display = 'none';
    olHint.textContent = '← → 切换难度 · 回车 开始';
    diffRow.style.display = 'flex';
    updateDiffUI();
    overlay.classList.remove('hidden');
  }

  function updateDiffUI() {
    diffItems.forEach(function(item, i) {
      item.classList.toggle('active', i === diffIdx);
    });
  }

  // --- Input ---
  document.addEventListener('keydown', function(e) {
    var key = e.key;

    if (state === 'menu') {
      if (key === 'ArrowLeft' || key === 'ArrowRight') {
        e.preventDefault();
        if (key === 'ArrowLeft') diffIdx = Math.max(0, diffIdx - 1);
        else diffIdx = Math.min(DIFFS.length - 1, diffIdx + 1);
        updateDiffUI();
      } else if (key === 'Enter' || key === ' ') {
        e.preventDefault();
        startGame();
      }
      return;
    }

    if (state === 'playing') {
      if (key === 'ArrowUp' || key === 'w' || key === 'W') { e.preventDefault(); movePlayer(-1, 0); }
      else if (key === 'ArrowDown' || key === 's' || key === 'S') { e.preventDefault(); movePlayer(1, 0); }
      else if (key === 'ArrowLeft' || key === 'a' || key === 'A') { e.preventDefault(); movePlayer(0, -1); }
      else if (key === 'ArrowRight' || key === 'd' || key === 'D') { e.preventDefault(); movePlayer(1, 0); }
      else if (key === ' ') { e.preventDefault(); showPause(); }
      return;
    }

    if (state === 'paused') {
      if (key === ' ') {
        e.preventDefault();
        state = 'playing';
        overlay.classList.add('hidden');
        startTime = Date.now() - elapsed * 1000;
        startTimer();
      } else if (key === 'Enter') {
        e.preventDefault();
        startGame();
      }
      return;
    }

    if (state === 'win') {
      if (key === 'Enter') { e.preventDefault(); startGame(); }
      else if (key === ' ') { e.preventDefault(); showMenu(); }
      return;
    }
  });

  // Touch controls
  document.querySelectorAll('.ctrl-btn[data-dir]').forEach(function(btn) {
    function handleDir(ev) {
      ev.preventDefault();
      var dir = btn.getAttribute('data-dir');
      if (state === 'playing') {
        if (dir === 'up') movePlayer(-1, 0);
        else if (dir === 'down') movePlayer(1, 0);
        else if (dir === 'left') movePlayer(0, -1);
        else if (dir === 'right') movePlayer(1, 0);
      }
    }
    btn.addEventListener('touchstart', handleDir, {passive:false});
    btn.addEventListener('mousedown', handleDir);
  });

  // Touch on overlay to start
  overlay.addEventListener('touchstart', function(e) {
    if (state === 'menu') {
      // Check if touch is on a diff item
      var target = e.target;
      if (target.classList.contains('diff-item')) {
        diffIdx = parseInt(target.getAttribute('data-diff'));
        updateDiffUI();
        return;
      }
      e.preventDefault();
      startGame();
    } else if (state === 'win') {
      e.preventDefault();
      startGame();
    } else if (state === 'paused') {
      e.preventDefault();
      state = 'playing';
      overlay.classList.add('hidden');
      startTime = Date.now() - elapsed * 1000;
      startTimer();
    }
  }, {passive:false});

  // Resize
  window.addEventListener('resize', function() {
    if (state === 'playing' || state === 'paused') {
      resize();
      draw();
    }
  });

  // Init
  showMenu();
  // Initial draw for background
  cols = DIFFS[diffIdx].cols;
  rows = DIFFS[diffIdx].rows;
  maze = generateMaze(cols, rows);
  playerR = 0; playerC = 0;
  goalR = rows - 1; goalC = cols - 1;
  resize();
  draw();
})();
</script>
</body>
</html>

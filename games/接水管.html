<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>接水管</title>
<meta name="game-icon" content="🔧">
<meta name="game-desc" content="旋转水管接通水流">
<meta name="game-tag" content="益智">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.game-header {
    display: flex;
    align-items: center;
    gap: min(4vw, 24px);
    margin-bottom: min(2vh, 12px);
    font-size: clamp(14px, 2.5vw, 20px);
}

.game-header span {
    display: flex;
    align-items: center;
    gap: 4px;
}

.game-header .val {
    color: #4ecca3;
    font-weight: bold;
    min-width: 2em;
    text-align: center;
}

#game-canvas {
    border: 2px solid #4ecca3;
    border-radius: 8px;
    background: #16213e;
    cursor: pointer;
    touch-action: none;
}

/* 覆盖层 */
.overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.78);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    backdrop-filter: blur(6px);
}

.overlay.hidden { display: none; }

.overlay h2 {
    font-size: clamp(24px, 5vw, 42px);
    margin-bottom: 12px;
    color: #4ecca3;
}

.overlay .sub {
    font-size: clamp(13px, 2.2vw, 18px);
    color: rgba(255,255,255,0.7);
    margin-bottom: 8px;
    text-align: center;
    max-width: 80vw;
    line-height: 1.5;
}

.diff-row {
    display: flex;
    gap: 12px;
    margin: 16px 0;
}

.diff-btn {
    padding: clamp(8px, 1.5vw, 14px) clamp(16px, 3vw, 32px);
    border: 2px solid #4ecca3;
    border-radius: 12px;
    background: rgba(78, 204, 163, 0.1);
    color: #4ecca3;
    font-size: clamp(14px, 2.5vw, 20px);
    cursor: pointer;
    transition: all 0.2s;
}

.diff-btn:hover, .diff-btn.active {
    background: #4ecca3;
    color: #1a1a2e;
    font-weight: bold;
}

.overlay .hint {
    font-size: clamp(12px, 2vw, 16px);
    color: rgba(255,255,255,0.5);
    margin-top: 16px;
}

.win-text {
    font-size: clamp(18px, 3.5vw, 30px);
    color: #ffd700;
    margin-bottom: 8px;
}

/* 触控方向键 */
.touch-controls {
    display: none;
    margin-top: min(2vh, 12px);
}

.touch-grid {
    display: grid;
    grid-template-columns: repeat(3, clamp(52px, 12vw, 72px));
    grid-template-rows: repeat(3, clamp(52px, 12vw, 72px));
    gap: 4px;
}

.ctrl-btn {
    min-width: 44px;
    min-height: 44px;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: clamp(20px, 5vw, 32px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
}

.ctrl-btn:active {
    background: rgba(78, 204, 163, 0.3);
    border-color: #4ecca3;
}

.ctrl-placeholder { visibility: hidden; }

@media (pointer: coarse) {
    .touch-controls { display: flex; justify-content: center; }
}

@media (max-width: 480px) {
    .touch-controls { display: flex; justify-content: center; }
}
</style>
</head>
<body>

<div class="game-header">
    <span>关卡: <span class="val" id="levelNum">1</span></span>
    <span>步数: <span class="val" id="moveCount">0</span></span>
    <span>时间: <span class="val" id="timer">0:00</span></span>
</div>

<canvas id="game-canvas"></canvas>

<div class="touch-controls">
    <div class="touch-grid">
        <div class="ctrl-placeholder"></div>
        <button class="ctrl-btn" data-dir="up">&#9650;</button>
        <div class="ctrl-placeholder"></div>
        <button class="ctrl-btn" data-dir="left">&#9664;</button>
        <button class="ctrl-btn" data-dir="rotate" style="font-size:clamp(14px,3vw,20px);">转</button>
        <button class="ctrl-btn" data-dir="right">&#9654;</button>
        <div class="ctrl-placeholder"></div>
        <button class="ctrl-btn" data-dir="down">&#9660;</button>
        <div class="ctrl-placeholder"></div>
    </div>
</div>

<!-- 开始界面 -->
<div class="overlay" id="startOverlay">
    <h2>接水管</h2>
    <div class="sub">旋转水管，把水从水源引到终点<br>方向键移动，回车/空格旋转</div>
    <div class="diff-row">
        <button class="diff-btn active" data-diff="easy">简单</button>
        <button class="diff-btn" data-diff="medium">普通</button>
        <button class="diff-btn" data-diff="hard">困难</button>
    </div>
    <div class="hint">按 回车 开始</div>
</div>

<!-- 暂停 -->
<div class="overlay hidden" id="pauseOverlay">
    <h2>暂停中</h2>
    <div class="hint">按 空格 继续</div>
</div>

<!-- 过关 -->
<div class="overlay hidden" id="winOverlay">
    <h2>接通了！</h2>
    <div class="win-text" id="winStats"></div>
    <div class="hint">按 回车 下一关</div>
</div>

<script>
(function() {
    var canvas = document.getElementById('game-canvas');
    var ctx = canvas.getContext('2d');
    var levelNumEl = document.getElementById('levelNum');
    var moveCountEl = document.getElementById('moveCount');
    var timerEl = document.getElementById('timer');
    var startOverlay = document.getElementById('startOverlay');
    var pauseOverlay = document.getElementById('pauseOverlay');
    var winOverlay = document.getElementById('winOverlay');
    var winStats = document.getElementById('winStats');

    var difficulty = 'easy';
    var gridSize = 5;
    var cellSize = 0;
    var pipes = []; // 每个格子: { type, rotation, fixed, filled }
    var sourceR = 0, sourceC = 0;
    var targetR = 0, targetC = 0;
    var cursorR = 0, cursorC = 0;
    var moves = 0;
    var seconds = 0;
    var timerInterval = null;
    var paused = false;
    var playing = false;
    var levelNum = 0;

    // 管道类型及连接方向（rotation=0时）
    // 连接位: 0=上, 1=右, 2=下, 3=左
    var PIPE_TYPES = {
        STRAIGHT: 'straight',   // 直管: 上-下 (0,2)
        CORNER: 'corner',       // 弯管: 上-右 (0,1)
        TEE: 'tee',             // T型: 上-右-下 (0,1,2)
        CROSS: 'cross'          // 十字: 全通 (0,1,2,3)
    };

    // 获取管道在指定旋转下的连接方向
    function getConnections(type, rotation) {
        var base;
        switch(type) {
            case 'straight': base = [0, 2]; break;
            case 'corner': base = [0, 1]; break;
            case 'tee': base = [0, 1, 2]; break;
            case 'cross': base = [0, 1, 2, 3]; break;
            default: base = [];
        }
        return base.map(function(d) { return (d + rotation) % 4; });
    }

    // 方向的行列偏移: 0=上, 1=右, 2=下, 3=左
    var DR = [-1, 0, 1, 0];
    var DC = [0, 1, 0, -1];
    var OPPOSITE = [2, 3, 0, 1];

    // 难度选择
    var diffBtns = document.querySelectorAll('.diff-btn');
    diffBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
            diffBtns.forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            difficulty = btn.dataset.diff;
        });
    });

    function formatTime(s) {
        var m = Math.floor(s / 60);
        var sec = s % 60;
        return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function startTimer() {
        stopTimer();
        seconds = 0;
        timerEl.textContent = '0:00';
        timerInterval = setInterval(function() {
            seconds++;
            timerEl.textContent = formatTime(seconds);
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function calcSize() {
        gridSize = difficulty === 'easy' ? 5 : difficulty === 'medium' ? 6 : 7;
        var maxW = window.innerWidth * 0.88;
        var maxH = window.innerHeight * 0.62;
        cellSize = Math.floor(Math.min(maxW / gridSize, maxH / gridSize));
        cellSize = Math.max(cellSize, 40);
        canvas.width = cellSize * gridSize;
        canvas.height = cellSize * gridSize;
    }

    // 生成关卡
    function generateLevel() {
        // 初始化空网格
        pipes = [];
        for (var r = 0; r < gridSize; r++) {
            var row = [];
            for (var c = 0; c < gridSize; c++) {
                row.push({ type: null, rotation: 0, fixed: false, filled: false });
            }
            pipes.push(row);
        }

        // 随机起点和终点
        sourceR = Math.floor(Math.random() * gridSize);
        sourceC = 0;
        targetR = Math.floor(Math.random() * gridSize);
        targetC = gridSize - 1;
        if (gridSize <= 5) {
            // 确保起点终点不在同一行（增加趣味）
            while (targetR === sourceR && gridSize > 3) {
                targetR = Math.floor(Math.random() * gridSize);
            }
        }

        // 用随机DFS生成一条路径
        var path = findPath();
        if (!path || path.length < 2) {
            // 重试
            generateLevel();
            return;
        }

        // 根据路径设置管道
        for (var i = 0; i < path.length; i++) {
            var p = path[i];
            var neededDirs = [];

            // 检查前一个格子
            if (i > 0) {
                var prev = path[i-1];
                for (var d = 0; d < 4; d++) {
                    if (p.r + DR[d] === prev.r && p.c + DC[d] === prev.c) {
                        neededDirs.push(d);
                        break;
                    }
                }
            }
            // 检查后一个格子
            if (i < path.length - 1) {
                var next = path[i+1];
                for (var d = 0; d < 4; d++) {
                    if (p.r + DR[d] === next.r && p.c + DC[d] === next.c) {
                        neededDirs.push(d);
                        break;
                    }
                }
            }

            // 根据需要的连接方向确定管道类型和旋转
            var pipeInfo = getPipeForDirs(neededDirs);
            pipes[p.r][p.c].type = pipeInfo.type;
            pipes[p.r][p.c].rotation = pipeInfo.rotation;
        }

        // 对不在路径上的格子，随机放一些管道
        for (var r = 0; r < gridSize; r++) {
            for (var c = 0; c < gridSize; c++) {
                if (!pipes[r][c].type) {
                    var types = ['straight', 'corner', 'corner', 'tee'];
                    pipes[r][c].type = types[Math.floor(Math.random() * types.length)];
                    pipes[r][c].rotation = Math.floor(Math.random() * 4);
                }
            }
        }

        // 打乱路径上管道的旋转（保存正确旋转，然后随机旋转）
        for (var i = 0; i < path.length; i++) {
            var p = path[i];
            if (pipes[p.r][p.c].type === 'cross') continue; // 十字不需要转
            var correctRot = pipes[p.r][p.c].rotation;
            var newRot;
            do {
                newRot = Math.floor(Math.random() * 4);
            } while (newRot === correctRot);
            pipes[p.r][p.c].rotation = newRot;
        }

        // 也随机打乱一些非路径管道
        for (var r = 0; r < gridSize; r++) {
            for (var c = 0; c < gridSize; c++) {
                if (Math.random() > 0.5) {
                    pipes[r][c].rotation = Math.floor(Math.random() * 4);
                }
            }
        }
    }

    function findPath() {
        var visited = {};
        var path = [];

        function dfs(r, c) {
            if (r === targetR && c === targetC) {
                path.push({r: r, c: c});
                return true;
            }
            var key = r + ',' + c;
            if (r < 0 || r >= gridSize || c < 0 || c >= gridSize) return false;
            if (visited[key]) return false;
            visited[key] = true;
            path.push({r: r, c: c});

            // 随机方向
            var dirs = [0, 1, 2, 3];
            for (var i = dirs.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = dirs[i]; dirs[i] = dirs[j]; dirs[j] = tmp;
            }

            // 优先向目标方向移动
            dirs.sort(function(a, b) {
                var distA = Math.abs(r + DR[a] - targetR) + Math.abs(c + DC[a] - targetC);
                var distB = Math.abs(r + DR[b] - targetR) + Math.abs(c + DC[b] - targetC);
                return distA - distB + (Math.random() - 0.5) * 2;
            });

            for (var i = 0; i < dirs.length; i++) {
                var nr = r + DR[dirs[i]];
                var nc = c + DC[dirs[i]];
                if (dfs(nr, nc)) return true;
            }

            path.pop();
            return false;
        }

        dfs(sourceR, sourceC);
        return path;
    }

    function getPipeForDirs(dirs) {
        if (dirs.length === 0) return { type: 'straight', rotation: 0 };
        if (dirs.length === 1) {
            // 只有一个方向（端点），用直管
            return { type: 'straight', rotation: dirs[0] % 2 === 0 ? 0 : 1 };
        }

        var d0 = dirs[0], d1 = dirs[1];
        // 确保 d0 < d1
        if (d0 > d1) { var tmp = d0; d0 = d1; d1 = tmp; }

        // 对面方向（0-2, 1-3）→ 直管
        if ((d0 === 0 && d1 === 2) || (d0 === 2 && d1 === 0)) {
            return { type: 'straight', rotation: 0 };
        }
        if ((d0 === 1 && d1 === 3) || (d0 === 3 && d1 === 1)) {
            return { type: 'straight', rotation: 1 };
        }

        // 相邻方向 → 弯管
        // corner base: [0,1] rotation=0
        // 需要找到 rotation 使得 (0+rot)%4 和 (1+rot)%4 匹配 d0,d1
        for (var rot = 0; rot < 4; rot++) {
            var conns = [(0 + rot) % 4, (1 + rot) % 4];
            conns.sort(function(a,b) { return a-b; });
            if (conns[0] === d0 && conns[1] === d1) {
                return { type: 'corner', rotation: rot };
            }
        }

        return { type: 'straight', rotation: 0 };
    }

    // 检查水是否连通
    function checkWaterFlow() {
        // 重置 filled 状态
        for (var r = 0; r < gridSize; r++) {
            for (var c = 0; c < gridSize; c++) {
                pipes[r][c].filled = false;
            }
        }

        // BFS 从水源开始
        var queue = [{r: sourceR, c: sourceC}];
        pipes[sourceR][sourceC].filled = true;
        var reached = false;

        while (queue.length > 0) {
            var curr = queue.shift();
            var pipe = pipes[curr.r][curr.c];
            var conns = getConnections(pipe.type, pipe.rotation);

            for (var i = 0; i < conns.length; i++) {
                var dir = conns[i];
                var nr = curr.r + DR[dir];
                var nc = curr.c + DC[dir];

                if (nr < 0 || nr >= gridSize || nc < 0 || nc >= gridSize) continue;
                if (pipes[nr][nc].filled) continue;

                // 检查邻居是否有对应的连接
                var neighborConns = getConnections(pipes[nr][nc].type, pipes[nr][nc].rotation);
                var oppDir = OPPOSITE[dir];
                if (neighborConns.indexOf(oppDir) >= 0) {
                    pipes[nr][nc].filled = true;
                    queue.push({r: nr, c: nc});
                    if (nr === targetR && nc === targetC) {
                        reached = true;
                    }
                }
            }
        }

        return reached;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (var r = 0; r < gridSize; r++) {
            for (var c = 0; c < gridSize; c++) {
                var x = c * cellSize;
                var y = r * cellSize;
                var pipe = pipes[r][c];

                // 格子背景
                ctx.fillStyle = (r + c) % 2 === 0 ? '#1e2d4a' : '#1a2740';
                ctx.fillRect(x, y, cellSize, cellSize);

                // 绘制管道
                drawPipe(x, y, pipe);

                // 水源标记
                if (r === sourceR && c === sourceC) {
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.3)';
                    ctx.fillRect(x, y, cellSize, cellSize);
                    ctx.fillStyle = '#3498db';
                    ctx.font = 'bold ' + Math.floor(cellSize * 0.25) + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('源', x + cellSize/2, y + cellSize * 0.15);
                }

                // 终点标记
                if (r === targetR && c === targetC) {
                    ctx.fillStyle = 'rgba(231, 76, 60, 0.3)';
                    ctx.fillRect(x, y, cellSize, cellSize);
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = 'bold ' + Math.floor(cellSize * 0.25) + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('终', x + cellSize/2, y + cellSize * 0.15);
                }

                // 光标
                if (r === cursorR && c === cursorC) {
                    ctx.strokeStyle = '#4ecca3';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([4, 4]);
                    ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
                    ctx.setLineDash([]);
                }
            }
        }
    }

    function drawPipe(x, y, pipe) {
        var cx = x + cellSize / 2;
        var cy = y + cellSize / 2;
        var pipeWidth = cellSize * 0.28;
        var halfLen = cellSize / 2;

        var conns = getConnections(pipe.type, pipe.rotation);
        var color = pipe.filled ? '#3498db' : '#5a6a8a';

        // 绘制管道段
        ctx.fillStyle = color;
        ctx.strokeStyle = pipe.filled ? '#2980b9' : '#4a5a7a';
        ctx.lineWidth = 2;

        for (var i = 0; i < conns.length; i++) {
            var dir = conns[i];
            var sx, sy, ex, ey;

            switch(dir) {
                case 0: sx = cx - pipeWidth/2; sy = y; ex = cx + pipeWidth/2; ey = cy; break; // 上
                case 1: sx = cx; sy = cy - pipeWidth/2; ex = x + cellSize; ey = cy + pipeWidth/2; break; // 右
                case 2: sx = cx - pipeWidth/2; sy = cy; ex = cx + pipeWidth/2; ey = y + cellSize; break; // 下
                case 3: sx = x; sy = cy - pipeWidth/2; ex = cx; ey = cy + pipeWidth/2; break; // 左
            }
            ctx.fillRect(sx, sy, ex - sx, ey - sy);
            ctx.strokeRect(sx, sy, ex - sx, ey - sy);
        }

        // 中心圆
        ctx.beginPath();
        ctx.arc(cx, cy, pipeWidth * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = pipe.filled ? '#2980b9' : '#4a5a7a';
        ctx.fill();
        ctx.strokeStyle = pipe.filled ? '#3498db' : '#5a6a8a';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 水流效果
        if (pipe.filled) {
            ctx.beginPath();
            ctx.arc(cx, cy, pipeWidth * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fill();
        }
    }

    function rotatePipe() {
        if (!playing || paused) return;
        var pipe = pipes[cursorR][cursorC];
        if (pipe.type === 'cross') return; // 十字不需要旋转

        pipe.rotation = (pipe.rotation + 1) % 4;
        moves++;
        moveCountEl.textContent = moves;

        // 检查连通
        var connected = checkWaterFlow();
        draw();

        if (connected) {
            winLevel();
        }
    }

    function moveCursor(dr, dc) {
        if (!playing || paused) return;
        cursorR = Math.max(0, Math.min(gridSize - 1, cursorR + dr));
        cursorC = Math.max(0, Math.min(gridSize - 1, cursorC + dc));
        draw();
    }

    function winLevel() {
        playing = false;
        stopTimer();
        winStats.textContent = moves + ' 步，用时 ' + formatTime(seconds);
        winOverlay.classList.remove('hidden');
    }

    function startGame() {
        startOverlay.classList.add('hidden');
        pauseOverlay.classList.add('hidden');
        winOverlay.classList.add('hidden');
        paused = false;
        playing = true;
        moves = 0;
        moveCountEl.textContent = '0';
        levelNum++;
        levelNumEl.textContent = levelNum;

        calcSize();
        generateLevel();
        cursorR = sourceR;
        cursorC = sourceC;

        // 初始检查连通（应该不通）
        checkWaterFlow();
        startTimer();
        draw();
    }

    function nextLevel() {
        winOverlay.classList.add('hidden');
        startGame();
    }

    function togglePause() {
        if (!playing) return;
        if (paused) {
            paused = false;
            pauseOverlay.classList.add('hidden');
        } else {
            paused = true;
            pauseOverlay.classList.remove('hidden');
        }
    }

    // 键盘
    document.addEventListener('keydown', function(e) {
        var key = e.key;

        if (key === 'Enter') {
            e.preventDefault();
            if (!playing) {
                if (!winOverlay.classList.contains('hidden')) {
                    nextLevel();
                } else {
                    startGame();
                }
            } else if (!paused) {
                rotatePipe();
            }
            return;
        }

        if (key === ' ' || key === 'Space') {
            e.preventDefault();
            if (playing) {
                if (paused) {
                    togglePause();
                } else {
                    rotatePipe();
                }
            }
            return;
        }

        if (!playing || paused) return;

        if (key === 'ArrowUp') { e.preventDefault(); moveCursor(-1, 0); }
        else if (key === 'ArrowDown') { e.preventDefault(); moveCursor(1, 0); }
        else if (key === 'ArrowLeft') { e.preventDefault(); moveCursor(0, -1); }
        else if (key === 'ArrowRight') { e.preventDefault(); moveCursor(0, 1); }
    });

    // Canvas 点击
    canvas.addEventListener('click', function(e) {
        if (!playing || paused) return;
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var c = Math.floor(x / cellSize);
        var r = Math.floor(y / cellSize);
        if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
            cursorR = r;
            cursorC = c;
            rotatePipe();
        }
    });

    // 触控
    document.querySelectorAll('.ctrl-btn[data-dir]').forEach(function(btn) {
        function handleDir() {
            if (!playing || paused) return;
            var dir = btn.dataset.dir;
            if (dir === 'up') moveCursor(-1, 0);
            else if (dir === 'down') moveCursor(1, 0);
            else if (dir === 'left') moveCursor(0, -1);
            else if (dir === 'right') moveCursor(0, 1);
            else if (dir === 'rotate') rotatePipe();
        }
        btn.addEventListener('touchstart', function(e) { e.preventDefault(); handleDir(); });
        btn.addEventListener('click', function(e) { e.preventDefault(); handleDir(); });
    });

    // 窗口大小变化
    window.addEventListener('resize', function() {
        if (playing) {
            calcSize();
            draw();
        }
    });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>打地鼠</title>
<meta name="game-icon" content="🔨">
<meta name="game-desc" content="快速反应打地鼠">
<meta name="game-tag" content="反应">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.info-bar{display:flex;gap:clamp(16px,4vw,32px);font-size:clamp(16px,3vw,24px);padding:8px 0;flex-shrink:0}
.info-bar .val{color:#4ecca3;font-weight:bold}
.grid{display:flex;flex-wrap:wrap;gap:clamp(8px,1.5vw,16px);padding:clamp(8px,1.5vw,12px)}
.hole{position:relative;width:33.33%;box-sizing:border-box;height:clamp(80px,22vw,140px);border-radius:50%;background:radial-gradient(ellipse at center,#2a1a0e 0%,#1a0e06 70%,#0d0704 100%);border:3px solid rgba(139,90,43,.4);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:border-color .15s,box-shadow .15s}
.hole.cursor{border-color:#4ecca3;box-shadow:0 0 16px rgba(78,204,163,.4)}
.mole{font-size:clamp(36px,10vw,64px);position:absolute;bottom:-100%;transition:bottom .2s ease-out;line-height:1}
.hole.active .mole{bottom:10%}
.hole.whacked .mole{bottom:10%}
.hole.whacked::after{content:'💥';position:absolute;font-size:clamp(28px,7vw,48px);z-index:2;animation:popFade .4s ease forwards}
.hole.miss::after{content:'❌';position:absolute;font-size:clamp(20px,5vw,36px);z-index:2;animation:popFade .3s ease forwards}
@keyframes popFade{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
.controls{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;width:min(32vw,140px);height:min(32vw,140px);margin-top:1vh;flex-shrink:0}
.ctrl-btn{min-width:44px;min-height:44px;border:2px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;font-size:clamp(14px,2.5vw,22px);cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ctrl-btn:active{background:rgba(78,204,163,.3);border-color:#4ecca3}
.ctrl-btn.empty{visibility:hidden;border:none;background:none}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px}
.overlay.hidden{display:none}
.overlay h1{font-size:clamp(26px,5vw,44px);margin-bottom:10px;text-shadow:0 0 20px rgba(78,204,163,.5)}
.overlay p{font-size:clamp(14px,2.5vw,20px);color:rgba(255,255,255,.7);margin-bottom:6px}
.diff-row{display:flex;gap:12px;margin:14px 0}
.diff-item{padding:10px 20px;border:2px solid rgba(255,255,255,.2);border-radius:10px;font-size:clamp(14px,2.5vw,20px);transition:all .2s}
.diff-item.active{border-color:#4ecca3;background:rgba(78,204,163,.2);color:#4ecca3;font-weight:bold}
.hint{font-size:clamp(13px,2vw,18px);color:rgba(255,255,255,.5);margin-top:12px}
.result-emoji{font-size:clamp(40px,8vw,64px);margin-bottom:8px}
.countdown{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(60px,15vw,120px);font-weight:bold;color:#4ecca3;z-index:20;text-shadow:0 0 30px rgba(78,204,163,.5);animation:countPop .8s ease forwards;pointer-events:none}
@keyframes countPop{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
</style>
</head>
<body>
<div class="info-bar" id="infoBar" style="visibility:hidden">
  <span>🎯 <span class="val" id="scoreDisplay">0</span></span>
  <span>⏱ <span class="val" id="timerDisplay">30</span>秒</span>
  <span>连击 <span class="val" id="comboDisplay">0</span></span>
</div>
<div class="grid" id="gameGrid"></div>

<div class="controls" id="touchControls" style="display:none">
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="up">▲</button>
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="left">◀</button>
  <button class="ctrl-btn" data-action="whack" style="font-size:clamp(12px,2vw,16px)">打!</button>
  <button class="ctrl-btn" data-dir="right">▶</button>
  <div class="ctrl-btn empty"></div>
  <button class="ctrl-btn" data-dir="down">▼</button>
  <div class="ctrl-btn empty"></div>
</div>

<div class="overlay" id="overlay">
  <h1 id="olTitle">🔨 打地鼠</h1>
  <p id="olSub">选择难度，按回车开始</p>
  <div class="diff-row" id="diffRow">
    <div class="diff-item" data-diff="0">简单</div>
    <div class="diff-item active" data-diff="1">普通</div>
    <div class="diff-item" data-diff="2">困难</div>
  </div>
  <p class="hint" id="olHint">← → 切换难度 · 回车 开始</p>
</div>

<script>
(function(){
  var overlay = document.getElementById('overlay');
  var olTitle = document.getElementById('olTitle');
  var olSub = document.getElementById('olSub');
  var olHint = document.getElementById('olHint');
  var diffRow = document.getElementById('diffRow');
  var diffItems = diffRow.querySelectorAll('.diff-item');
  var infoBar = document.getElementById('infoBar');
  var scoreEl = document.getElementById('scoreDisplay');
  var timerEl = document.getElementById('timerDisplay');
  var comboEl = document.getElementById('comboDisplay');
  var gameGrid = document.getElementById('gameGrid');
  var touchControls = document.getElementById('touchControls');

  var GRID = 3;
  var GAME_TIME = 30;
  var MOLE_EMOJIS = ['🐹','🐿️','🐻'];

  // Difficulty: how long moles stay (ms), spawn interval range (ms)
  var DIFFS = [
    {name:'简单', moleTime:2200, spawnMin:800, spawnMax:1500, maxActive:1},
    {name:'普通', moleTime:1500, spawnMin:600, spawnMax:1200, maxActive:2},
    {name:'困难', moleTime:900, spawnMin:400, spawnMax:800, maxActive:3}
  ];

  var state = 'menu'; // menu, countdown, playing, result
  var diffIdx = 1;
  var holes = [];
  var cursorR = 1, cursorC = 1; // start at center
  var score = 0, combo = 0, maxCombo = 0;
  var timeLeft = GAME_TIME;
  var gameTimer = null;
  var spawnTimer = null;
  var activeMoles = {}; // index -> timeout

  function buildGrid() {
    gameGrid.innerHTML = '';
    holes = [];
    for (var i = 0; i < GRID * GRID; i++) {
      var hole = document.createElement('div');
      hole.className = 'hole';
      hole.setAttribute('data-idx', i);
      var mole = document.createElement('div');
      mole.className = 'mole';
      mole.textContent = MOLE_EMOJIS[Math.floor(Math.random() * MOLE_EMOJIS.length)];
      hole.appendChild(mole);
      gameGrid.appendChild(hole);
      holes.push({el:hole, moleEl:mole, active:false});

      // Touch to whack
      (function(idx, el){
        el.addEventListener('touchstart', function(e){
          e.preventDefault();
          if (state === 'playing') {
            cursorR = Math.floor(idx / GRID);
            cursorC = idx % GRID;
            updateCursor();
            doWhack(idx);
          }
        }, {passive:false});
        el.addEventListener('click', function(){
          if (state === 'playing') {
            cursorR = Math.floor(idx / GRID);
            cursorC = idx % GRID;
            updateCursor();
            doWhack(idx);
          }
        });
      })(i, hole);
    }
    updateCursor();
  }

  function updateCursor() {
    holes.forEach(function(h, i) {
      var r = Math.floor(i / GRID);
      var c = i % GRID;
      h.el.classList.toggle('cursor', r === cursorR && c === cursorC);
    });
  }

  function startCountdown() {
    state = 'countdown';
    overlay.classList.add('hidden');
    infoBar.style.visibility = 'visible';
    touchControls.style.display = 'grid';
    score = 0; combo = 0; maxCombo = 0;
    scoreEl.textContent = '0';
    comboEl.textContent = '0';
    timeLeft = GAME_TIME;
    timerEl.textContent = timeLeft;
    buildGrid();
    clearAllMoles();

    var count = 3;
    function showCount() {
      var el = document.createElement('div');
      el.className = 'countdown';
      el.textContent = count > 0 ? count : '开始！';
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 800);
      if (count > 0) {
        count--;
        setTimeout(showCount, 800);
      } else {
        setTimeout(startPlaying, 400);
      }
    }
    showCount();
  }

  function startPlaying() {
    state = 'playing';
    timeLeft = GAME_TIME;
    timerEl.textContent = timeLeft;

    gameTimer = setInterval(function(){
      timeLeft--;
      timerEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);

    scheduleSpawn();
  }

  function scheduleSpawn() {
    if (state !== 'playing') return;
    var diff = DIFFS[diffIdx];
    var delay = diff.spawnMin + Math.random() * (diff.spawnMax - diff.spawnMin);
    spawnTimer = setTimeout(function(){
      spawnMole();
      scheduleSpawn();
    }, delay);
  }

  function spawnMole() {
    if (state !== 'playing') return;
    var diff = DIFFS[diffIdx];
    var activeCount = Object.keys(activeMoles).length;
    if (activeCount >= diff.maxActive) return;

    // Find inactive holes
    var available = [];
    for (var i = 0; i < holes.length; i++) {
      if (!holes[i].active) available.push(i);
    }
    if (available.length === 0) return;

    var idx = available[Math.floor(Math.random() * available.length)];
    var hole = holes[idx];
    hole.active = true;
    hole.moleEl.textContent = MOLE_EMOJIS[Math.floor(Math.random() * MOLE_EMOJIS.length)];
    hole.el.classList.add('active');

    // Auto-hide after moleTime
    activeMoles[idx] = setTimeout(function(){
      hideMole(idx, false);
    }, diff.moleTime);
  }

  function hideMole(idx, wasWhacked) {
    if (!holes[idx]) return;
    var hole = holes[idx];
    hole.active = false;
    hole.el.classList.remove('active');
    if (activeMoles[idx]) {
      clearTimeout(activeMoles[idx]);
      delete activeMoles[idx];
    }
    if (!wasWhacked) {
      // Missed a mole — reset combo
      if (state === 'playing') {
        combo = 0;
        comboEl.textContent = combo;
      }
    }
  }

  function clearAllMoles() {
    for (var i = 0; i < holes.length; i++) {
      hideMole(i, false);
      holes[i].el.classList.remove('whacked', 'miss');
    }
  }

  function doWhack(idx) {
    if (state !== 'playing') return;
    var hole = holes[idx];

    if (hole.active) {
      // Hit!
      hole.el.classList.remove('active');
      hole.el.classList.add('whacked');
      score += 10 + combo * 2;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      scoreEl.textContent = score;
      comboEl.textContent = combo;
      hideMole(idx, true);
      setTimeout(function(){ hole.el.classList.remove('whacked'); }, 400);
    } else {
      // Miss
      hole.el.classList.add('miss');
      combo = 0;
      comboEl.textContent = combo;
      setTimeout(function(){ hole.el.classList.remove('miss'); }, 300);
    }
  }

  function endGame() {
    state = 'result';
    clearInterval(gameTimer);
    clearTimeout(spawnTimer);
    clearAllMoles();

    var stars = '';
    if (score >= 200) stars = '🌟🌟🌟';
    else if (score >= 100) stars = '🌟🌟';
    else if (score >= 50) stars = '🌟';
    else stars = '💪';

    var msg = '';
    if (score >= 200) msg = '太厉害了！反应超快！';
    else if (score >= 100) msg = '非常棒！手眼协调！';
    else if (score >= 50) msg = '不错哦！继续加油！';
    else msg = '慢慢来，多练练就好了！';

    setTimeout(function(){
      olTitle.innerHTML = '<span class="result-emoji">' + stars + '</span><br>时间到！';
      olSub.textContent = '得分 ' + score + ' · 最高连击 ' + maxCombo + ' — ' + msg;
      olHint.textContent = '回车 再来一局 · 空格 换难度';
      diffRow.style.display = 'none';
      infoBar.style.visibility = 'hidden';
      touchControls.style.display = 'none';
      overlay.classList.remove('hidden');
    }, 500);
  }

  function showMenu() {
    state = 'menu';
    clearInterval(gameTimer);
    clearTimeout(spawnTimer);
    infoBar.style.visibility = 'hidden';
    touchControls.style.display = 'none';
    olTitle.textContent = '🔨 打地鼠';
    olSub.textContent = '选择难度，按回车开始';
    olHint.textContent = '← → 切换难度 · 回车 开始';
    diffRow.style.display = 'flex';
    updateDiffUI();
    overlay.classList.remove('hidden');
  }

  function updateDiffUI() {
    diffItems.forEach(function(item, i) {
      item.classList.toggle('active', i === diffIdx);
    });
  }

  // --- Input ---
  document.addEventListener('keydown', function(e) {
    var key = e.key;

    if (state === 'menu') {
      if (key === 'ArrowLeft' || key === 'ArrowRight') {
        e.preventDefault();
        if (key === 'ArrowLeft') diffIdx = Math.max(0, diffIdx - 1);
        else diffIdx = Math.min(DIFFS.length - 1, diffIdx + 1);
        updateDiffUI();
      } else if (key === 'Enter' || key === ' ') {
        e.preventDefault();
        startCountdown();
      }
      return;
    }

    if (state === 'playing') {
      if (key === 'ArrowUp' || key === 'w' || key === 'W') {
        e.preventDefault();
        cursorR = Math.max(0, cursorR - 1);
        updateCursor();
      } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
        e.preventDefault();
        cursorR = Math.min(GRID - 1, cursorR + 1);
        updateCursor();
      } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
        e.preventDefault();
        cursorC = Math.max(0, cursorC - 1);
        updateCursor();
      } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
        e.preventDefault();
        cursorC = Math.min(GRID - 1, cursorC + 1);
        updateCursor();
      } else if (key === 'Enter' || key === ' ') {
        e.preventDefault();
        var idx = cursorR * GRID + cursorC;
        doWhack(idx);
      }
      return;
    }

    if (state === 'result') {
      if (key === 'Enter') { e.preventDefault(); startCountdown(); }
      else if (key === ' ') { e.preventDefault(); showMenu(); }
      return;
    }
  });

  // Touch controls
  document.querySelectorAll('.ctrl-btn[data-dir]').forEach(function(btn) {
    function handleDir(ev) {
      ev.preventDefault();
      if (state !== 'playing') return;
      var dir = btn.getAttribute('data-dir');
      if (dir === 'up') cursorR = Math.max(0, cursorR - 1);
      else if (dir === 'down') cursorR = Math.min(GRID - 1, cursorR + 1);
      else if (dir === 'left') cursorC = Math.max(0, cursorC - 1);
      else if (dir === 'right') cursorC = Math.min(GRID - 1, cursorC + 1);
      updateCursor();
    }
    btn.addEventListener('touchstart', handleDir, {passive:false});
    btn.addEventListener('mousedown', handleDir);
  });

  var whackBtn = document.querySelector('.ctrl-btn[data-action="whack"]');
  if (whackBtn) {
    function handleWhack(ev) {
      ev.preventDefault();
      if (state !== 'playing') return;
      var idx = cursorR * GRID + cursorC;
      doWhack(idx);
    }
    whackBtn.addEventListener('touchstart', handleWhack, {passive:false});
    whackBtn.addEventListener('mousedown', handleWhack);
  }

  // Touch overlay
  overlay.addEventListener('touchstart', function(e) {
    if (state === 'menu') {
      var target = e.target;
      if (target.classList.contains('diff-item')) {
        diffIdx = parseInt(target.getAttribute('data-diff'));
        updateDiffUI();
        return;
      }
      e.preventDefault();
      startCountdown();
    } else if (state === 'result') {
      e.preventDefault();
      startCountdown();
    }
  }, {passive:false});

  showMenu();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎲 2048</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.top-bar{display:flex;align-items:center;gap:clamp(12px,3vw,24px);padding:clamp(8px,1.5vw,14px) 0;font-size:clamp(14px,2.5vw,20px);flex-shrink:0}
.brand{font-size:clamp(20px,4vw,32px);font-weight:bold;background:linear-gradient(135deg,#e74c3c,#f1c40f);-webkit-background-clip:text;background-clip:text;color:transparent}
.score-box{background:#0f0f1f;padding:6px 14px;border-radius:10px;font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.score-box .label{font-size:11px;color:rgba(255,255,255,.5)}
.score-box .val{color:#4ecca3;font-weight:bold;font-size:clamp(16px,3vw,22px)}
.tip{font-size:clamp(12px,2vw,14px);color:rgba(255,255,255,.5);margin-bottom:8px}

/* 棋盘：background-grid + foreground-tiles 两层 */
.board-wrap{position:relative;width:min(88vw,440px);aspect-ratio:1}
.bg-grid{position:absolute;inset:0;display:grid;gap:clamp(6px,1vw,10px);padding:clamp(6px,1vw,10px);background:#3a3a5e;border-radius:12px}
.bg-cell{background:rgba(255,255,255,.08);border-radius:8px}
.tiles{position:absolute;inset:0;display:grid;gap:clamp(6px,1vw,10px);padding:clamp(6px,1vw,10px)}
.tile{display:flex;align-items:center;justify-content:center;font-weight:bold;border-radius:8px;background:#cdc1b4;color:#776e65;transition:transform .14s ease, background .14s ease, color .14s ease, font-size .14s ease;font-size:clamp(22px,6vw,44px)}
.tile[data-v="2"]   {background:#eee4da;color:#776e65}
.tile[data-v="4"]   {background:#ede0c8;color:#776e65}
.tile[data-v="8"]   {background:#f2b179;color:#f9f6f2}
.tile[data-v="16"]  {background:#f59563;color:#f9f6f2}
.tile[data-v="32"]  {background:#f67c5f;color:#f9f6f2}
.tile[data-v="64"]  {background:#f65e3b;color:#f9f6f2}
.tile[data-v="128"] {background:#edcf72;color:#f9f6f2;font-size:clamp(18px,5vw,38px)}
.tile[data-v="256"] {background:#edcc61;color:#f9f6f2;font-size:clamp(18px,5vw,38px)}
.tile[data-v="512"] {background:#edc850;color:#f9f6f2;font-size:clamp(18px,5vw,38px)}
.tile[data-v="1024"]{background:#edc53f;color:#f9f6f2;font-size:clamp(14px,4vw,30px)}
.tile[data-v="2048"]{background:#edc22e;color:#f9f6f2;font-size:clamp(14px,4vw,30px);box-shadow:0 0 24px rgba(237,194,46,.6)}
.tile[data-v="4096"], .tile[data-v="8192"], .tile[data-v="16384"]{background:#3c3a32;color:#f9f6f2;font-size:clamp(14px,4vw,28px)}
.tile.spawn{animation:spawn .16s ease}
@keyframes spawn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.tile.merged{animation:pulse .22s ease}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}

.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px}
.overlay.hidden{display:none}
.overlay h1{font-size:clamp(26px,5vw,44px);margin-bottom:10px;text-shadow:0 0 20px rgba(78,204,163,.5)}
.overlay p{font-size:clamp(14px,2.5vw,20px);color:rgba(255,255,255,.7);margin-bottom:6px;text-align:center}
.diff-row{display:flex;gap:12px;margin:16px 0}
.diff-btn{padding:clamp(8px,1.5vw,14px) clamp(16px,3vw,32px);border:2px solid #4ecca3;border-radius:12px;background:rgba(78,204,163,.1);color:#4ecca3;font-size:clamp(14px,2.5vw,20px);cursor:pointer;transition:all .2s}
.diff-btn:hover,.diff-btn.active{background:#4ecca3;color:#1a1a2e;font-weight:bold}
.overlay .hint{font-size:clamp(12px,2vw,16px);color:rgba(255,255,255,.5);margin-top:10px;text-align:center}
.overlay .start-btn{margin-top:14px;padding:clamp(12px,2vw,18px) clamp(28px,5vw,48px);border:none;border-radius:14px;background:#4ecca3;color:#1a1a2e;font-size:clamp(16px,3vw,22px);font-weight:bold;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(78, 204, 163, 0.35)}
.overlay .start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(78, 204, 163, 0.5)}
.overlay .start-btn:active{transform:translateY(0)}

.overlay .final{text-align:center;margin:10px 0}
.overlay .final .score-big{font-size:clamp(40px,10vw,80px);color:#ffd700;font-weight:bold}
.overlay .final .score-label{font-size:clamp(14px,2.5vw,20px);color:rgba(255,255,255,.7)}
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand">2048</div>
  <div class="score-box"><div class="label">当前</div><div class="val" id="score">0</div></div>
  <div class="score-box"><div class="label">最高</div><div class="val" id="best">0</div></div>
</div>
<div class="tip">方向键 / WASD · 手机滑动</div>

<div class="board-wrap" id="boardWrap">
  <div class="bg-grid" id="bgGrid"></div>
  <div class="tiles" id="tiles"></div>
</div>

<!-- 开始菜单 -->
<div class="overlay" id="overlay">
  <h1>🎲 2048</h1>
  <p>滑动或方向键移动<br>相同数字相撞就合并</p>
  <div class="diff-row" id="diffRow">
    <button class="diff-btn" data-diff="3">3×3</button>
    <button class="diff-btn active" data-diff="4">4×4</button>
    <button class="diff-btn" data-diff="5">5×5</button>
    <button class="diff-btn" data-diff="6">6×6</button>
  </div>
  <div class="hint">按 回车 或点击 开始游戏</div>
  <button class="start-btn" id="startBtn">开始游戏</button>
</div>

<!-- 游戏结束 -->
<div class="overlay hidden" id="endOverlay">
  <h1 id="endTitle">💪 继续加油</h1>
  <div class="final">
    <div class="score-big" id="endScore">0</div>
    <div class="score-label">最终得分</div>
  </div>
  <div class="hint">按 回车 或点击 再来一局</div>
  <button class="start-btn" id="restartBtn">再来一局</button>
</div>

<script>
(function() {
  var bgGrid = document.getElementById('bgGrid');
  var tilesEl = document.getElementById('tiles');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var endOverlay = document.getElementById('endOverlay');
  var diffRow = document.getElementById('diffRow');
  var diffBtns = diffRow.querySelectorAll('.diff-btn');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var endTitle = document.getElementById('endTitle');
  var endScore = document.getElementById('endScore');

  var state = 'menu'; // menu / playing / over / win
  var size = 4;
  var grid = []; // 0 empty, or number
  var score = 0;
  var best = 0;
  var won2048 = false;
  var inputLocked = false;

  function keyBest() { return '2048-best-' + size; }

  function loadBest() {
    best = parseInt(localStorage.getItem(keyBest()) || '0', 10);
    bestEl.textContent = best;
  }
  function saveBest() {
    if (score > best) { best = score; localStorage.setItem(keyBest(), String(best)); bestEl.textContent = best; }
  }

  function buildBg() {
    bgGrid.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
    bgGrid.innerHTML = '';
    for (var i = 0; i < size * size; i++) {
      var d = document.createElement('div');
      d.className = 'bg-cell';
      bgGrid.appendChild(d);
    }
  }

  function buildTiles() {
    tilesEl.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
  }

  function newGame() {
    grid = [];
    for (var r = 0; r < size; r++) {
      grid.push([]);
      for (var c = 0; c < size; c++) grid[r].push(0);
    }
    score = 0;
    won2048 = false;
    scoreEl.textContent = '0';
    addRandomTile();
    addRandomTile();
    state = 'playing';
    render();
  }

  function render(spawnList) {
    tilesEl.innerHTML = '';
    spawnList = spawnList || [];
    var spawnSet = {};
    spawnList.forEach(function(k) { spawnSet[k] = true; });
    for (var r = 0; r < size; r++) for (var c = 0; c < size; c++) {
      if (grid[r][c] === 0) continue;
      var div = document.createElement('div');
      div.className = 'tile';
      div.dataset.v = grid[r][c];
      div.textContent = grid[r][c];
      if (spawnSet[r + ',' + c]) div.classList.add('spawn');
      tilesEl.appendChild(div);
    }
    scoreEl.textContent = score;
  }

  function addRandomTile() {
    var empties = [];
    for (var r = 0; r < size; r++) for (var c = 0; c < size; c++) {
      if (grid[r][c] === 0) empties.push([r, c]);
    }
    if (empties.length === 0) return false;
    var idx = Math.floor(Math.random() * empties.length);
    var rc = empties[idx];
    grid[rc[0]][rc[1]] = Math.random() < 0.9 ? 2 : 4;
    return true;
  }

  // 将一行向左合并一次（核心算法）
  function slideLeft(row) {
    // 经典两步法：先把非零元素挤到一端，再合并相邻相同
    var filtered = [];
    for (var i = 0; i < row.length; i++) {
      if (row[i] !== 0) filtered.push(row[i]);
    }
    var out = [];
    var mergedIdx = [];
    var j = 0;
    while (j < filtered.length) {
      if (j + 1 < filtered.length && filtered[j + 1] === filtered[j]) {
        var merged = filtered[j] * 2;
        out.push(merged);
        score += merged;
        mergedIdx.push(out.length - 1);
        if (merged === 2048) won2048 = true;
        j += 2;
      } else {
        out.push(filtered[j]);
        j++;
      }
    }
    // 尾部补 0 到原始长度
    while (out.length < row.length) out.push(0);
    return { row: out, merged: mergedIdx };
  }

  function rotateCW(g) {
    var n = g.length;
    var r = [];
    for (var i = 0; i < n; i++) { r.push([]); for (var j = 0; j < n; j++) r[i].push(0); }
    for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) r[j][n - 1 - i] = g[i][j];
    return r;
  }

  function move(dir) {
    if (state !== 'playing' || inputLocked) return false;
    // 源码 rotateCW 把列方向倒序映射到行方向，导致 up/down 反了
    // 这里重新映射：up 需要逆时针旋转（等效 rotateCW 3 次），down 保持顺时针一次
    var rotations = { left: 0, up: 3, right: 2, down: 1 }[dir];
    var g = grid.map(function(row) { return row.slice(); });

    // 旋转到 left 视角，slideLeft，再旋转回来
    for (var i = 0; i < rotations; i++) g = rotateCW(g);

    var changed = false;
    for (var r = 0; r < size; r++) {
      var before = g[r].slice();
      var res = slideLeft(before);
      g[r] = res.row;
      if (!changed) {
        for (var c = 0; c < size; c++) if (before[c] !== g[r][c]) { changed = true; break; }
      }
    }
    for (var i = 0; i < (4 - rotations) % 4; i++) g = rotateCW(g);

    if (!changed) return false;

    grid = g;
    saveBest();
    addRandomTile();
    render();
    // 检查状态
    if (won2048 && state === 'playing') {
      // 达到 2048 可选继续玩 — 这里设为提示但不阻止
    }
    if (!canMove()) {
      state = 'over';
      setTimeout(function() {
        endTitle.textContent = '💪 继续加油';
        endScore.textContent = score;
        endOverlay.classList.remove('hidden');
      }, 220);
    }
    return true;
  }

  function canMove() {
    for (var r = 0; r < size; r++) for (var c = 0; c < size; c++) {
      if (grid[r][c] === 0) return true;
      if (c + 1 < size && grid[r][c] === grid[r][c + 1]) return true;
      if (r + 1 < size && grid[r][c] === grid[r + 1][c]) return true;
    }
    return false;
  }

  // ---- 键盘 ----
  var keyMap = {
    'ArrowLeft': 'left', 'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down',
    'a': 'left', 'A': 'left', 'd': 'right', 'D': 'right',
    'w': 'up', 'W': 'up', 's': 'down', 'S': 'down'
  };
  document.addEventListener('keydown', function(e) {
    if (!overlay.classList.contains('hidden') || !endOverlay.classList.contains('hidden')) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        overlay.classList.add('hidden'); endOverlay.classList.add('hidden');
        startGame();
      }
      return;
    }
    var d = keyMap[e.key];
    if (d) { e.preventDefault(); move(d); }
  });

  // ---- 触摸滑动 ----
  var touchStart = null;
  document.addEventListener('touchstart', function(e) {
    if (state !== 'playing') return;
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (state !== 'playing' || !touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  // ---- 鼠标滚轮 ----
  document.addEventListener('wheel', function(e) {
    if (state !== 'playing') return;
    e.preventDefault();
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) move(e.deltaX > 0 ? 'right' : 'left');
    else move(e.deltaY > 0 ? 'down' : 'up');
  }, { passive: false });

  function startGame() {
    buildBg(); buildTiles(); loadBest(); newGame();
  }

  diffBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      diffBtns.forEach(function(b) { b.classList.toggle('active', b === btn); });
      size = parseInt(btn.getAttribute('data-diff'), 10);
      loadBest();
    });
  });
  startBtn.addEventListener('click', function() { overlay.classList.add('hidden'); startGame(); });
  restartBtn.addEventListener('click', function() { endOverlay.classList.add('hidden'); startGame(); });
  overlay.addEventListener('click', function(e) {
    if (e.target.classList.contains('diff-btn')) return;
    if (!overlay.classList.contains('hidden')) { overlay.classList.add('hidden'); startGame(); }
  });
  endOverlay.addEventListener('click', function(e) {
    if (e.target.classList.contains('start-btn')) return;
    if (!endOverlay.classList.contains('hidden')) { endOverlay.classList.add('hidden'); startGame(); }
  });

  // 初始
  size = 4;
  loadBest();
})();
</script>
</body>
</html>

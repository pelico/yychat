<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>即时聊天室</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --me: #4f46e5;
    --other: #334155;
    --ok: #22c55e;
    --err: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: var(--text);
    overflow: hidden;
  }

  /* ---------- 入场页 ---------- */
  #gate {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 420px; background: rgba(30, 41, 59, .85);
    backdrop-filter: blur(12px); border: 1px solid rgba(148,163,184,.15);
    border-radius: 20px; padding: 32px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .card h1 { margin: 0 0 6px; font-size: 24px; text-align: center;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .card p.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,.2);
    background: rgba(15,23,42,.6); color: var(--text); font-size: 15px; outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn {
    width: 100%; padding: 13px; border: none; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; transition: transform .1s, opacity .2s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 14px; line-height: 1.6; }

  /* ---------- 聊天页 ---------- */
  #app { display: none; flex-direction: column; height: 100%; }
  #app.show { display: flex; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: rgba(30,41,59,.7); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(148,163,184,.12);
  }
  header .room-info { flex: 1; min-width: 0; }
  header .room-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .room-meta { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--err); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(148,163,184,.2);
    background: rgba(15,23,42,.5); color: var(--text); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { transform: scale(.92); }

  #messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    overscroll-behavior: contain;
  }
  .msg { display: flex; flex-direction: column; max-width: 80%; animation: pop .18s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.other { align-self: flex-start; align-items: flex-start; }
  .msg .who { font-size: 11px; color: var(--muted); margin: 0 4px 4px; }
  .msg .bubble {
    padding: 9px 13px; border-radius: 16px; font-size: 15px; line-height: 1.45; word-break: break-word;
    white-space: pre-wrap; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .msg.me .bubble { background: var(--me); border-bottom-right-radius: 4px; color: #fff; }
  .msg.other .bubble { background: var(--other); border-bottom-left-radius: 4px; }
  .msg .time { font-size: 10px; color: var(--muted); margin: 4px 4px 0; }

  /* 大 emoji 消息 */
  .msg.emoji-only .bubble { background: transparent !important; box-shadow: none; padding: 0; font-size: 288px; line-height: 1.15; }
  .msg.me.emoji-only { align-items: flex-end; }
  .bubble .big-emoji { font-size: 132px; vertical-align: middle; }

  /* 图片消息（画板） */
  .msg .bubble img { max-width: 220px; max-height: 240px; border-radius: 10px; display: block; }

  /* emoji 飞入动效 */
  .fly-emoji {
    position: fixed; top: 0; left: 0; z-index: 100; pointer-events: none;
    will-change: transform, opacity; user-select: none; line-height: 1; white-space: nowrap;
  }
  .msg.emoji-only .bubble.pop-in { animation: bubblePop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bubblePop {
    0% { transform: scale(0.2); opacity: 0; }
    55% { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .sys {
    align-self: center; font-size: 12px; color: var(--muted); background: rgba(148,163,184,.1);
    padding: 4px 12px; border-radius: 12px; margin: 4px 0;
  }

  /* ---------- 输入区 ---------- */
  #composer {
    display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px;
    background: rgba(30,41,59,.7); backdrop-filter: blur(10px); border-top: 1px solid rgba(148,163,184,.12);
    position: relative;
  }
  #emoji-btn { flex-shrink: 0; }
  #text {
    flex: 1; resize: none; max-height: 120px; min-height: 40px; padding: 10px 14px; border-radius: 20px;
    border: 1px solid rgba(148,163,184,.2); background: rgba(15,23,42,.6); color: var(--text);
    font-size: 15px; outline: none; line-height: 1.4; font-family: inherit;
  }
  #send {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  #send:active { transform: scale(.9); }
  #send:disabled { opacity: .4; }

  /* ---------- emoji 面板 ---------- */
  #emoji-panel {
    display: none; position: absolute; bottom: 100%; left: 12px; right: 12px; max-height: 240px;
    background: var(--panel); border: 1px solid rgba(148,163,184,.2); border-radius: 14px;
    padding: 8px; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,.4); z-index: 10;
  }
  #emoji-panel.show { display: block; }
  .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 2px; }
  .emoji-grid button {
    background: none; border: none; cursor: pointer; font-size: 26px; padding: 6px; border-radius: 8px;
    transition: background .15s;
  }
  .emoji-grid button:hover { background: rgba(148,163,184,.15); }
  .emoji-cat { font-size: 11px; color: var(--muted); padding: 6px 4px 2px; }

  /* ---------- 画板 ---------- */
  #board {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
    align-items: center; justify-content: center; padding: 12px; flex-direction: column;
  }
  #board.show { display: flex; }
  .board-bar {
    width: 100%; max-width: 460px; background: var(--panel); border: 1px solid rgba(148,163,184,.2);
    border-radius: 14px; padding: 10px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .board-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .board-label { font-size: 11px; color: var(--muted); margin-right: 2px; }
  .swatch {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer;
    transition: transform .1s; flex-shrink: 0;
  }
  .swatch:active { transform: scale(.85); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .size-btn, .tool-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(148,163,184,.25);
    background: rgba(15,23,42,.5); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .size-btn.active, .tool-btn.active { background: var(--accent); border-color: var(--accent); }
  .size-btn .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: none; border: none; }
  .board-spacer { flex: 1; }
  .board-btn {
    padding: 8px 12px; border-radius: 10px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .board-btn.send { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; }
  .board-btn.ghost { background: rgba(148,163,184,.15); color: var(--text); }
  #board-canvas {
    background: #fff; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.5);
    touch-action: none; max-width: 100%; max-height: 70vh;
  }
  /* 画板 emoji 选择条 */
  #board-emoji-bar {
    display: none; width: 100%; max-width: 460px; max-height: 88px; overflow-x: auto; overflow-y: hidden;
    background: var(--panel); border: 1px solid rgba(148,163,184,.2); border-radius: 12px;
    padding: 6px 8px; margin-bottom: 10px; white-space: nowrap;
  }
  #board-emoji-bar.show { display: block; }
  #board-emoji-bar .be-btn {
    background: none; border: none; cursor: pointer; font-size: 26px; padding: 4px 6px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; transition: background .15s;
  }
  #board-emoji-bar .be-btn:hover { background: rgba(148,163,184,.2); }
  #board-emoji-bar .be-btn.active { background: var(--accent); }

  /* 滚动条 */
  #messages::-webkit-scrollbar, #emoji-panel::-webkit-scrollbar, #board-emoji-bar::-webkit-scrollbar { width: 6px; height: 6px; }
  #messages::-webkit-scrollbar-thumb, #emoji-panel::-webkit-scrollbar-thumb, #board-emoji-bar::-webkit-scrollbar-thumb { background: rgba(148,163,184,.3); border-radius: 3px; }
</style>
</head>
<body>

<!-- 入场页 -->
<div id="gate">
  <div class="card">
    <h1>即时聊天室</h1>
    <p class="sub">实时同步 · 多人在线 · 大表情</p>
    <div class="field">
      <label>你的昵称</label>
      <input id="nick-input" maxlength="16" placeholder="取个名字吧" />
    </div>
    <div class="field">
      <label>房间名</label>
      <input id="room-input" maxlength="32" placeholder="输入相同房间名即可互通" value="lobby" />
    </div>
    <button class="btn" id="enter-btn">进入聊天</button>
    <p class="hint">基于公共 MQTT 通道，请勿发送敏感信息。<br/>不同设备访问同一房间名即可实时通信。</p>
  </div>
</div>

<!-- 聊天页 -->
<div id="app">
  <header>
    <div class="room-info">
      <div class="room-name" id="room-name">lobby</div>
      <div class="room-meta"><span class="dot" id="status-dot"></span><span id="status-text">连接中…</span></div>
    </div>
    <button class="icon-btn" id="leave-btn" title="离开">✕</button>
  </header>

  <div id="messages"></div>

  <div id="composer">
    <div id="emoji-panel">
      <div id="emoji-content"></div>
    </div>
    <button class="icon-btn" id="emoji-btn" title="表情">😀</button>
    <button class="icon-btn" id="board-btn" title="画板">🎨</button>
    <textarea id="text" rows="1" placeholder="发条消息…"></textarea>
    <button id="send" title="发送">➤</button>
  </div>
</div>

<!-- 画板 -->
<div id="board">
  <div class="board-bar">
    <div class="board-group" id="board-colors">
      <span class="board-label">颜色</span>
      <span class="swatch active" data-color="#000000" style="background:#000"></span>
      <span class="swatch" data-color="#ef4444" style="background:#ef4444"></span>
      <span class="swatch" data-color="#f97316" style="background:#f97316"></span>
      <span class="swatch" data-color="#eab308" style="background:#eab308"></span>
      <span class="swatch" data-color="#22c55e" style="background:#22c55e"></span>
      <span class="swatch" data-color="#06b6d4" style="background:#06b6d4"></span>
      <span class="swatch" data-color="#3b82f6" style="background:#3b82f6"></span>
      <span class="swatch" data-color="#a855f7" style="background:#a855f7"></span>
      <span class="swatch" data-color="#ec4899" style="background:#ec4899"></span>
    </div>
    <div class="board-group" id="board-sizes">
      <span class="board-label">粗细</span>
      <button class="size-btn active" data-size="4" title="细"><span class="dot" style="width:6px;height:6px"></span></button>
      <button class="size-btn" data-size="8" title="中"><span class="dot" style="width:10px;height:10px"></span></button>
      <button class="size-btn" data-size="14" title="粗"><span class="dot" style="width:16px;height:16px"></span></button>
    </div>
    <div class="board-group" id="board-tools">
      <span class="board-label">形状</span>
      <button class="tool-btn active" data-tool="pen" title="自由画">✏️</button>
      <button class="tool-btn" data-tool="line" title="直线">／</button>
      <button class="tool-btn" data-tool="rect" title="矩形">▭</button>
      <button class="tool-btn" data-tool="circle" title="圆形">○</button>
      <button class="tool-btn" data-tool="eraser" title="橡皮">🧽</button>
      <button class="tool-btn" data-tool="emoji" title="放表情">😀</button>
    </div>
    <div class="board-spacer"></div>
    <button class="board-btn ghost" id="board-undo">撤销</button>
    <button class="board-btn ghost" id="board-clear">清空</button>
    <button class="board-btn send" id="board-send">发送</button>
    <button class="board-btn ghost" id="board-close">✕</button>
  </div>
  <div id="board-emoji-bar"></div>
  <canvas id="board-canvas" width="400" height="400"></canvas>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function () {
  "use strict";

  // ===== 配置 =====
  // 公共 MQTT broker（WSS），任何人都可连接；同一房间 topic 即可互通
  var BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
  var TOPIC_PREFIX = "trae-chat-v1/";   // 房间 topic 前缀

  // ===== Emoji 集 =====
  var EMOJI = {
    "表情": "😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😋 😛 😜 🤪 😝 🤗 🤭 🤫 🤔 🤐 😐 😑 😶 😏 😒 🙄 😬 😔 😪 🤤 😴 😷 🤒 🤕 🤢 🤮 🥵 🥶 😎 🤓 🧐 😕 😟 🙁 😮 😯 😲 😳 🥺 😢 😭 😱 😨 😰 😡 😠 🤬 😈 👿 💀 💩 🤡 👻 👽 🤖".split(" "),
    "手势": "👍 👎 👊 ✊ 🤛 🤜 👏 🙌 👐 🤲 🙏 🤝 💪 👋 🤚 🖐 ✋ 🖖 👌 🤌 🤏 ✌️ 🤞 🤟 🤘 👈 👉 👆 👇 ☝️ ✍️".split(" "),
    "心情": "❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 💟 💯 🔥 ⭐ 🌟 ✨ ⚡ 💥 💢 💧 💦".split(" "),
    "动物": "🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🦄 🐝 🦋 🐌 🐞 🐢 🐙 🦕 🦖 🐬 🐳 🐋".split(" "),
    "食物": "🍎 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍈 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🥑 🍆 🥔 🥕 🌽 🌶 🥦 🍞 🧀 🥚 🍳 🥞 🍔 🍟 🍕 🌭 🍣 🍦 🍰 🍩 🍪 ☕ 🍺 🍷".split(" "),
    "活动": "⚽ 🏀 🏈 ⚾ 🎾 🏐 🏉 🎱 🏓 🏸 🥅 🏒 🏑 🥍 🏏 ⛳ 🎯 🎮 🕹 🎲 🎰 🎳 🎪 🎭 🎨 🎬 🎤 🎧 🎼 🎹 🥁 🎸 🎻 🏆 🥇 🎉 🎊 🎈 🎁".split(" "),
    "旅行": "🚗 🚕 🚙 🚌 🏎 🚓 🚑 🚒 🚚 🚲 🛵 🏍 ✈️ 🚀 🛸 🚁 ⛵ 🚤 🛳 ⛴ 🚂 🚆 🚊 🚉 🗼 🗽 🗿 🏰 🏯 🎡 🎢 🏖 🏔 🌋 🏕 🌅 🌄 🌠".split(" "),
    "物品": "💎 🔑 🔒 🔓 🛒 💰 💴 💵 💶 💷 💸 💳 🧲 🔫 💣 🧨 🪓 🔪 🗡 ⚔️ 🛡 🚬 ⛓ 🧷 🧹 🧺 🧻 📱 💻 ⌨️ 🖥 🖨 📷 🎥 📺 📡 ⏰ ⏳".split(" ")
  };

  // ===== 状态 =====
  var client = null;
  var nick = "";
  var room = "";
  var topic = "";
  var connected = false;
  var autoScroll = true;

  // ===== DOM =====
  var $ = function (id) { return document.getElementById(id); };
  var gate = $("gate"), app = $("app");
  var nickInput = $("nick-input"), roomInput = $("room-input"), enterBtn = $("enter-btn");
  var roomName = $("room-name"), statusDot = $("status-dot"), statusText = $("status-text");
  var leaveBtn = $("leave-btn");
  var messagesEl = $("messages");
  var textEl = $("text"), sendBtn = $("send");
  var emojiBtn = $("emoji-btn"), emojiPanel = $("emoji-panel"), emojiContent = $("emoji-content");
  var mqttLib = (typeof mqtt !== "undefined") ? mqtt : (window.mqtt || null);

  // ===== 工具 =====
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function nowTime() {
    var d = new Date();
    function p(n) { return n < 10 ? "0" + n : n; }
    return p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function isEmojiOnly(str) {
    // 去除空白后，全是 emoji/符号字符
    var s = str.replace(/\s/g, "");
    if (!s) return false;
    // 简单判定：每个字符都落在常见 emoji 区间或为变体选择符
    var re = /^(\p{Extended_Pictographic}|\p{Emoji_Component}|\u200d|\ufe0f)+$/u;
    return re.test(s);
  }
  function renderEmoji(text) {
    // 给所有 emoji 字符套 span 以便放大样式（保持文字小，emoji 大）
    var re = /(\p{Extended_Pictographic}(\p{Emoji_Component}|\u200d|\ufe0f)*)/gu;
    return esc(text).replace(re, '<span class="big-emoji">$1</span>');
  }

  // ===== 入场 =====
  enterBtn.addEventListener("click", enter);
  [nickInput, roomInput].forEach(function (el) {
    el.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) enter(); });
  });
  function enter() {
    nick = nickInput.value.trim() || "匿名";
    room = roomInput.value.trim() || "lobby";
    // topic 仅允许字母数字下划线中划线
    var safeRoom = room.replace(/[^a-zA-Z0-9_\-]/g, "-").slice(0, 32) || "lobby";
    topic = TOPIC_PREFIX + safeRoom;
    roomName.textContent = room;
    gate.style.display = "none";
    app.classList.add("show");
    connect();
  }

  // ===== MQTT 连接 =====
  function connect() {
    if (!mqttLib) {
      setStatus(false, "MQTT 库加载失败");
      addSys("MQTT 库加载失败，请检查网络后刷新。");
      return;
    }
    setStatus(false, "连接中…");
    var clientId = "trae-chat-" + Math.random().toString(36).slice(2, 10);
    try {
      client = mqttLib.connect(BROKER_URL, {
        clientId: clientId,
        clean: true,
        reconnectPeriod: 3000,
        connectTimeout: 8000,
        keepalive: 30
      });
    } catch (e) {
      setStatus(false, "连接失败");
      addSys("连接失败：" + esc(e.message || String(e)));
      return;
    }

    client.on("connect", function () {
      connected = true;
      setStatus(true, "已连接");
      client.subscribe(topic, { qos: 0 }, function (err) {
        if (err) { addSys("订阅房间失败"); }
        else {
          addSys("已进入房间「" + esc(room) + "」");
          // 广播加入
          publish({ type: "sys", text: nick + " 加入了房间", t: Date.now() });
        }
      });
    });

    client.on("reconnect", function () { setStatus(false, "重连中…"); });
    client.on("close", function () { connected = false; setStatus(false, "已断开"); });
    client.on("error", function (err) { setStatus(false, "错误"); addSys("连接错误：" + esc(err.message || String(err))); });

    client.on("message", function (t, payload) {
      try {
        var msg = JSON.parse(payload.toString());
        onMessage(msg);
      } catch (e) { /* 忽略非法消息 */ }
    });
  }

  function publish(msg) {
    if (!client || !connected) return;
    try { client.publish(topic, JSON.stringify(msg), { qos: 0 }); } catch (e) {}
  }

  function onMessage(msg) {
    if (!msg || !msg.type) return;
    if (msg.type === "sys") {
      addSys(msg.text || "");
    } else if (msg.type === "chat") {
      // 自己发的也会收到（broker 回环），用 id 去重
      if (msg.id && lastSentId === msg.id) { lastSentId = null; return; }
      addChat(msg.nick || "匿名", msg.text || "", msg.t || Date.now(), false);
    } else if (msg.type === "image") {
      if (msg.id && lastSentId === msg.id) { lastSentId = null; return; }
      addImage(msg.nick || "匿名", msg.data || "", msg.t || Date.now(), false);
    }
  }

  // ===== 发送 =====
  var lastSentId = null;
  function send() {
    var text = textEl.value;
    if (!text.trim() || !connected) return;
    var id = Math.random().toString(36).slice(2, 10);
    lastSentId = id;
    var msg = { type: "chat", id: id, nick: nick, text: text, t: Date.now() };
    publish(msg);
    addChat(nick, text, msg.t, true);
    textEl.value = "";
    autoSize();
    closeEmoji();
  }
  sendBtn.addEventListener("click", send);
  textEl.addEventListener("keydown", function (e) {
    // 输入法组合态（中文选词等）不拦截 Enter，否则会打断输入并误发消息
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      send();
    }
  });
  textEl.addEventListener("input", autoSize);
  function autoSize() {
    textEl.style.height = "auto";
    textEl.style.height = Math.min(120, textEl.scrollHeight) + "px";
  }

  // ===== emoji 飞入动效 =====
  var flyingCount = 0;
  function flyEmoji(bubble, text, isMe) {
    if (document.hidden) return false;
    if (flyingCount > 4) return false; // 限流，避免刷屏卡顿
    var rect = bubble.getBoundingClientRect();
    // 目标在视口外（罕见，滚动延迟）则不播
    if (rect.bottom < 0 || rect.top > window.innerHeight) return false;
    var endX = rect.left + rect.width / 2;
    var endY = rect.top + rect.height / 2;
    var fs = parseFloat(getComputedStyle(bubble).fontSize) || 96;

    var W = window.innerWidth, H = window.innerHeight;
    var startX, startY;
    if (isMe) {
      // 自己发的：从右下（发送键附近）飞出
      startX = W * (0.7 + Math.random() * 0.2);
      startY = H + 30;
    } else {
      // 别人发的：从左/上边缘飞入
      startX = -40;
      startY = H * (0.1 + Math.random() * 0.5);
    }
    // 贝塞尔控制点：偏向侧上方，形成弧线
    var side = isMe ? -1 : 1;
    var ctrlX = (startX + endX) / 2 + side * (100 + Math.random() * 120);
    var ctrlY = Math.min(startY, endY) - (80 + Math.random() * 120);

    var el = document.createElement("div");
    el.className = "fly-emoji";
    el.textContent = text;
    el.style.fontSize = fs + "px";
    document.body.appendChild(el);
    flyingCount++;

    var dur = 780;
    var t0 = performance.now();
    function frame(now) {
      var t = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - t, 3); // easeOutCubic
      var u = 1 - e;
      var x = u * u * startX + 2 * u * e * ctrlX + e * e * endX;
      var y = u * u * startY + 2 * u * e * ctrlY + e * e * endY;
      // 缩放：小→过冲→落定
      var s;
      if (t < 0.7) s = 0.4 + (t / 0.7) * 0.9;       // 0.4 → 1.3
      else s = 1.3 - ((t - 0.7) / 0.3) * 0.3;        // 1.3 → 1.0
      var rot = (1 - e) * 28 * side;
      el.style.transform = "translate(-50%,-50%) translate(" + x + "px," + y + "px) scale(" + s + ") rotate(" + rot + "deg)";
      el.style.opacity = t < 0.85 ? 1 : (1 - (t - 0.85) / 0.15);
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        el.remove();
        flyingCount--;
        // 气泡弹出显示
        bubble.style.opacity = "";
        bubble.classList.remove("pop-in");
        // 强制重绘以重启动画
        void bubble.offsetWidth;
        bubble.classList.add("pop-in");
      }
    }
    requestAnimationFrame(frame);
    return true;
  }

  // ===== 渲染消息 =====
  function addChat(who, text, t, isMe) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + (isMe ? "me" : "other");
    var emojiOnly = isEmojiOnly(text);
    if (emojiOnly) wrap.className += " emoji-only";

    var whoEl = document.createElement("div");
    whoEl.className = "who";
    whoEl.textContent = isMe ? "我" : who;
    wrap.appendChild(whoEl);

    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (emojiOnly) {
      bubble.textContent = text;   // 纯 emoji，直接放原字符，CSS 放大
      bubble.style.opacity = "0";  // 先隐藏，等飞入动效结束后再弹出显示
    } else {
      bubble.innerHTML = renderEmoji(text);
    }
    wrap.appendChild(bubble);

    var timeEl = document.createElement("div");
    timeEl.className = "time";
    timeEl.textContent = nowTime();
    wrap.appendChild(timeEl);

    messagesEl.appendChild(wrap);
    maybeScroll();
    // 插入 DOM 并滚动后再启动飞入（此时才能取到气泡的真实位置和字号）
    if (emojiOnly) {
      if (!flyEmoji(bubble, text, isMe)) bubble.style.opacity = ""; // 未能播放则直接显示
    }
    // 限制消息数量，避免过长
    while (messagesEl.children.length > 300) {
      messagesEl.removeChild(messagesEl.firstChild);
    }
  }

  function addImage(who, dataUrl, t, isMe) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + (isMe ? "me" : "other");
    var whoEl = document.createElement("div");
    whoEl.className = "who";
    whoEl.textContent = isMe ? "我" : who;
    wrap.appendChild(whoEl);
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    var img = document.createElement("img");
    img.src = dataUrl;
    img.alt = "画板作品";
    bubble.appendChild(img);
    wrap.appendChild(bubble);
    var timeEl = document.createElement("div");
    timeEl.className = "time";
    timeEl.textContent = nowTime();
    wrap.appendChild(timeEl);
    messagesEl.appendChild(wrap);
    maybeScroll();
    while (messagesEl.children.length > 300) {
      messagesEl.removeChild(messagesEl.firstChild);
    }
  }

  function addSys(text) {
    var el = document.createElement("div");
    el.className = "sys";
    el.textContent = text;
    messagesEl.appendChild(el);
    maybeScroll();
  }

  function maybeScroll() {
    if (autoScroll) messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  messagesEl.addEventListener("scroll", function () {
    var atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 60;
    autoScroll = atBottom;
  });

  function setStatus(on, text) {
    statusDot.className = "dot " + (on ? "on" : "off");
    statusText.textContent = text;
    sendBtn.disabled = !on;
  }

  // ===== 离开 =====
  leaveBtn.addEventListener("click", function () {
    if (client && connected) {
      try {
        publish({ type: "sys", text: nick + " 离开了房间", t: Date.now() });
        client.end(true);
      } catch (e) {}
    }
    connected = false;
    client = null;
    app.classList.remove("show");
    gate.style.display = "flex";
    messagesEl.innerHTML = "";
    setStatus(false, "未连接");
  });

  window.addEventListener("beforeunload", function () {
    if (client && connected) {
      try { publish({ type: "sys", text: nick + " 离开了房间", t: Date.now() }); client.end(true); } catch (e) {}
    }
  });

  // ===== Emoji 面板 =====
  function buildEmojiPanel() {
    var html = "";
    Object.keys(EMOJI).forEach(function (cat) {
      html += '<div class="emoji-cat">' + esc(cat) + "</div>";
      html += '<div class="emoji-grid">';
      EMOJI[cat].forEach(function (e) {
        html += '<button type="button" data-e="' + esc(e) + '">' + e + "</button>";
      });
      html += "</div>";
    });
    emojiContent.innerHTML = html;
    emojiContent.addEventListener("click", function (ev) {
      var b = ev.target.closest("button[data-e]");
      if (!b) return;
      insertAtCursor(textEl, b.getAttribute("data-e"));
      textEl.focus();
      autoSize();
    });
  }
  function insertAtCursor(field, value) {
    var s = field.selectionStart, e = field.selectionEnd;
    field.value = field.value.slice(0, s) + value + field.value.slice(e);
    field.selectionStart = field.selectionEnd = s + value.length;
  }
  emojiBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    emojiPanel.classList.toggle("show");
  });
  document.addEventListener("click", function (e) {
    if (!emojiPanel.contains(e.target) && e.target !== emojiBtn) closeEmoji();
  });
  function closeEmoji() { emojiPanel.classList.remove("show"); }

  buildEmojiPanel();

  // ===== 画板 =====
  var board = $("board");
  var boardBtn = $("board-btn");
  var boardCanvas = $("board-canvas");
  var bctx = boardCanvas.getContext("2d");
  var boardHistory = [];

  function clearBoard() {
    bctx.fillStyle = "#ffffff";
    bctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
  }
  clearBoard();

  var drawState = { drawing: false, tool: "pen", color: "#000000", size: 4, startX: 0, startY: 0, snapshot: null, emojiChar: "😀" };

  // 画板 emoji 选择条
  var boardEmojiBar = $("board-emoji-bar");
  var boardEmojiChars = EMOJI["表情"].concat(EMOJI["手势"], EMOJI["心情"]);
  boardEmojiChars.forEach(function (ch, i) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "be-btn" + (i === 0 ? " active" : "");
    btn.textContent = ch;
    btn.addEventListener("click", function () {
      drawState.emojiChar = ch;
      Array.prototype.forEach.call(boardEmojiBar.querySelectorAll(".be-btn"), function (x) { x.classList.remove("active"); });
      btn.classList.add("active");
      Array.prototype.forEach.call($("board-tools").querySelectorAll(".tool-btn"), function (x) { x.classList.remove("active"); });
      $("board-tools").querySelector('[data-tool="emoji"]').classList.add("active");
      drawState.tool = "emoji";
      boardEmojiBar.classList.add("show");
    });
    boardEmojiBar.appendChild(btn);
  });

  function pushHistory() {
    try {
      boardHistory.push(bctx.getImageData(0, 0, boardCanvas.width, boardCanvas.height));
      if (boardHistory.length > 30) boardHistory.shift();
    } catch (e) {}
  }
  function undoBoard() {
    if (boardHistory.length === 0) return;
    bctx.putImageData(boardHistory.pop(), 0, 0);
  }

  $("board-tools").addEventListener("click", function (e) {
    var b = e.target.closest(".tool-btn");
    if (!b) return;
    Array.prototype.forEach.call($("board-tools").querySelectorAll(".tool-btn"), function (x) { x.classList.remove("active"); });
    b.classList.add("active");
    drawState.tool = b.getAttribute("data-tool");
    if (drawState.tool === "emoji") boardEmojiBar.classList.add("show");
    else boardEmojiBar.classList.remove("show");
  });
  $("board-colors").addEventListener("click", function (e) {
    var s = e.target.closest(".swatch");
    if (!s) return;
    Array.prototype.forEach.call($("board-colors").querySelectorAll(".swatch"), function (x) { x.classList.remove("active"); });
    s.classList.add("active");
    drawState.color = s.getAttribute("data-color");
  });
  $("board-sizes").addEventListener("click", function (e) {
    var b = e.target.closest(".size-btn");
    if (!b) return;
    Array.prototype.forEach.call($("board-sizes").querySelectorAll(".size-btn"), function (x) { x.classList.remove("active"); });
    b.classList.add("active");
    drawState.size = parseInt(b.getAttribute("data-size"), 10) || 4;
  });

  function getPos(e) {
    var rect = boardCanvas.getBoundingClientRect();
    var cx, cy;
    if (e.touches && e.touches[0]) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    return { x: (cx - rect.left) * (boardCanvas.width / rect.width), y: (cy - rect.top) * (boardCanvas.height / rect.height) };
  }
  function startDraw(e) {
    e.preventDefault();
    var p = getPos(e);
    pushHistory();
    // emoji 工具：点击即放置，无需拖动
    if (drawState.tool === "emoji") {
      var sizeMap = { 4: 44, 8: 72, 14: 104 };
      bctx.font = (sizeMap[drawState.size] || 48) + "px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
      bctx.textAlign = "center";
      bctx.textBaseline = "middle";
      bctx.fillText(drawState.emojiChar || "😀", p.x, p.y);
      drawState.drawing = false;
      return;
    }
    drawState.drawing = true;
    drawState.startX = p.x; drawState.startY = p.y;
    if (drawState.tool === "line" || drawState.tool === "rect" || drawState.tool === "circle") {
      drawState.snapshot = bctx.getImageData(0, 0, boardCanvas.width, boardCanvas.height);
    }
    if (drawState.tool === "pen" || drawState.tool === "eraser") {
      bctx.beginPath();
      bctx.moveTo(p.x, p.y);
    }
  }
  function moveDraw(e) {
    if (!drawState.drawing) return;
    e.preventDefault();
    var p = getPos(e);
    bctx.lineCap = "round"; bctx.lineJoin = "round";
    bctx.lineWidth = drawState.size;
    bctx.strokeStyle = drawState.tool === "eraser" ? "#ffffff" : drawState.color;
    if (drawState.tool === "pen" || drawState.tool === "eraser") {
      bctx.lineTo(p.x, p.y); bctx.stroke();
    } else if (drawState.snapshot) {
      bctx.putImageData(drawState.snapshot, 0, 0);
      bctx.beginPath();
      if (drawState.tool === "line") { bctx.moveTo(drawState.startX, drawState.startY); bctx.lineTo(p.x, p.y); bctx.stroke(); }
      else if (drawState.tool === "rect") { bctx.strokeRect(drawState.startX, drawState.startY, p.x - drawState.startX, p.y - drawState.startY); }
      else if (drawState.tool === "circle") {
        var dx = p.x - drawState.startX, dy = p.y - drawState.startY;
        bctx.arc(drawState.startX, drawState.startY, Math.sqrt(dx * dx + dy * dy), 0, Math.PI * 2);
        bctx.stroke();
      }
    }
  }
  function endDraw() { drawState.drawing = false; drawState.snapshot = null; }

  boardCanvas.addEventListener("mousedown", startDraw);
  boardCanvas.addEventListener("mousemove", moveDraw);
  window.addEventListener("mouseup", endDraw);
  boardCanvas.addEventListener("touchstart", startDraw, { passive: false });
  boardCanvas.addEventListener("touchmove", moveDraw, { passive: false });
  window.addEventListener("touchend", endDraw);

  $("board-clear").addEventListener("click", function () { pushHistory(); clearBoard(); });
  $("board-undo").addEventListener("click", undoBoard);
  $("board-close").addEventListener("click", function () { board.classList.remove("show"); });
  boardBtn.addEventListener("click", function () { board.classList.add("show"); });

  $("board-send").addEventListener("click", function () {
    if (!connected) { addSys("未连接，无法发送"); return; }
    var dataUrl = boardCanvas.toDataURL("image/jpeg", 0.7);
    if (dataUrl.length > 120000) dataUrl = boardCanvas.toDataURL("image/jpeg", 0.45);
    var id = Math.random().toString(36).slice(2, 10);
    lastSentId = id;
    var msg = { type: "image", id: id, nick: nick, data: dataUrl, t: Date.now() };
    publish(msg);
    addImage(nick, dataUrl, msg.t, true);
    board.classList.remove("show");
    clearBoard();
    boardHistory.length = 0;
  });

  nickInput.focus();
})();
</script>
</body>
</html>

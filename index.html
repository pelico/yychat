<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>即时聊天室</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --me: #4f46e5;
    --other: #334155;
    --ok: #22c55e;
    --err: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: var(--text);
    overflow: hidden;
  }

  /* ---------- 入场页 ---------- */
  #gate {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 420px; background: rgba(30, 41, 59, .85);
    backdrop-filter: blur(12px); border: 1px solid rgba(148,163,184,.15);
    border-radius: 20px; padding: 32px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .card h1 { margin: 0 0 6px; font-size: 24px; text-align: center;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .card p.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,.2);
    background: rgba(15,23,42,.6); color: var(--text); font-size: 15px; outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn {
    width: 100%; padding: 13px; border: none; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; transition: transform .1s, opacity .2s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 14px; line-height: 1.6; }

  /* ---------- 聊天页 ---------- */
  #app { display: none; flex-direction: row; height: 100%; }
  #app.show { display: flex; }

  /* 侧边栏 */
  #sidebar {
    width: 76px; flex-shrink: 0; background: rgba(15,23,42,.95);
    border-right: 1px solid rgba(148,163,184,.12); display: flex; flex-direction: column;
    align-items: center; padding: 14px 0 10px; gap: 6px; z-index: 5;
  }
  .nav-btn {
    width: 58px; height: 58px; border-radius: 14px; border: none; cursor: pointer;
    background: transparent; color: var(--muted); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; transition: all .2s;
  }
  .nav-btn .nav-icon { font-size: 22px; line-height: 1; }
  .nav-btn .nav-label { font-size: 10px; line-height: 1; }
  .nav-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .nav-btn:active { transform: scale(.92); }
  .sidebar-spacer { flex: 1; }

  /* 视图容器 */
  #chat-view { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #games-view { flex: 1; display: none; flex-direction: column; min-width: 0; min-height: 0; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
  #games-view.show { display: flex; }

  /* 游戏室：列表 */
  #games-list { flex: 1; overflow-y: auto; padding: 20px 16px; }
  #games-list .gh-title { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 4px;
    background: linear-gradient(90deg, #4ecca3, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  #games-list .gh-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 20px; }
  .games-grid { display: flex; flex-wrap: wrap; justify-content: center; max-width: 1000px; margin: 0 auto; }
  .game-card {
    width: 150px; margin: 8px; background: rgba(30,41,59,.7); border: 2px solid rgba(148,163,184,.15);
    border-radius: 14px; padding: 16px 12px; text-align: center; cursor: pointer; color: var(--text);
    transition: all .2s; border: none; font-family: inherit;
  }
  .game-card:hover { border-color: var(--accent); background: rgba(99,102,241,.15); transform: translateY(-2px); }
  .game-card:active { transform: scale(.96); }
  .game-card .gc-icon { font-size: 44px; display: block; margin-bottom: 8px; }
  .game-card .gc-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .game-card .gc-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
  .game-card .gc-tag { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 10px; font-size: 10px; background: rgba(99,102,241,.2); color: #a5b4fc; }

  /* 游戏室：播放器 */
  #games-player { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #games-player.show { display: flex; }
  .player-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: rgba(30,41,59,.7); border-bottom: 1px solid rgba(148,163,184,.12); }
  .player-bar .pb-title { flex: 1; font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #game-frame { flex: 1; border: none; width: 100%; background: #1a1a2e; }

  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: rgba(30,41,59,.7); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(148,163,184,.12);
  }
  header .room-info { flex: 1; min-width: 0; }
  header .room-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .room-meta { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--err); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(148,163,184,.2);
    background: rgba(15,23,42,.5); color: var(--text); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { transform: scale(.92); }

  #messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    overscroll-behavior: contain;
  }
  .msg { display: flex; flex-direction: column; max-width: 80%; animation: pop .18s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.other { align-self: flex-start; align-items: flex-start; }
  .msg .who { font-size: 11px; color: var(--muted); margin: 0 4px 4px; }
  .msg .bubble {
    padding: 9px 13px; border-radius: 16px; font-size: 15px; line-height: 1.45; word-break: break-word;
    white-space: pre-wrap; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .msg.me .bubble { background: var(--me); border-bottom-right-radius: 4px; color: #fff; }
  .msg.other .bubble { background: var(--other); border-bottom-left-radius: 4px; }
  .msg .time { font-size: 10px; color: var(--muted); margin: 4px 4px 0; display: flex; align-items: center; gap: 4px; }
  .msg .ding-icon {
    display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px;
    border-radius: 50%; font-size: 9px; line-height: 1; cursor: help; transition: all .2s;
    flex-shrink: 0;
  }
  .msg .ding-icon.pending { background: rgba(148,163,184,.3); color: #94a3b8; }
  .msg .ding-icon.success { background: rgba(34,197,94,.25); color: #22c55e; }
  .msg .ding-icon.error { background: rgba(239,68,68,.25); color: #ef4444; }
  .msg .ding-icon.error:hover { background: rgba(239,68,68,.4); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg .ding-icon.pending::before { animation: spin 1s linear infinite; }

  /* 大 emoji 消息 */
  .msg.emoji-only .bubble { background: transparent !important; box-shadow: none; padding: 0; font-size: 180px; line-height: 1.15; }
  .msg.me.emoji-only { align-items: flex-end; }
  .bubble .big-emoji { font-size: 96px; vertical-align: middle; }

  /* 图片消息（画板） */
  .msg .bubble img { max-width: 220px; max-height: 240px; border-radius: 10px; display: block; }

  /* emoji 飞入动效 */
  .fly-emoji {
    position: fixed; top: 0; left: 0; z-index: 100; pointer-events: none;
    will-change: transform, opacity; user-select: none; line-height: 1; white-space: nowrap;
  }
  .msg.emoji-only .bubble.pop-in { animation: bubblePop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bubblePop {
    0% { transform: scale(0.2); opacity: 0; }
    55% { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .sys {
    align-self: center; font-size: 12px; color: var(--muted); background: rgba(148,163,184,.1);
    padding: 4px 12px; border-radius: 12px; margin: 4px 0;
  }

  /* ---------- 输入区 ---------- */
  #composer {
    display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px;
    background: rgba(30,41,59,.7); backdrop-filter: blur(10px); border-top: 1px solid rgba(148,163,184,.12);
    position: relative;
  }
  #emoji-btn { flex-shrink: 0; }
  #text {
    flex: 1; resize: none; max-height: 120px; min-height: 40px; padding: 10px 14px; border-radius: 20px;
    border: 1px solid rgba(148,163,184,.2); background: rgba(15,23,42,.6); color: var(--text);
    font-size: 15px; outline: none; line-height: 1.4; font-family: inherit;
  }
  #send {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  #send:active { transform: scale(.9); }
  #send:disabled { opacity: .4; }

  /* ---------- emoji 面板 ---------- */
  #emoji-panel {
    display: none; position: absolute; bottom: 100%; left: 12px; right: 12px; max-height: 240px;
    background: var(--panel); border: 1px solid rgba(148,163,184,.2); border-radius: 14px;
    padding: 8px; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,.4); z-index: 10;
  }
  #emoji-panel.show { display: block; }
  .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 2px; }
  .emoji-grid button {
    background: none; border: none; cursor: pointer; font-size: 26px; padding: 6px; border-radius: 8px;
    transition: background .15s;
  }
  .emoji-grid button:hover { background: rgba(148,163,184,.15); }
  .emoji-cat { font-size: 11px; color: var(--muted); padding: 6px 4px 2px; }

  /* ---------- 画板 ---------- */
  #board {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
    align-items: center; justify-content: safe center; padding: 12px; flex-direction: column;
    overflow-y: auto;
  }
  #board.show { display: flex; }
  .board-bar {
    width: 100%; max-width: 900px; background: var(--panel); border: 1px solid rgba(148,163,184,.2);
    border-radius: 16px; padding: 8px 10px; margin-bottom: 8px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .board-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .board-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .board-label { font-size: 11px; color: var(--muted); margin-right: 2px; white-space: nowrap; }
  .row-divider { width: 1px; height: 20px; background: rgba(148,163,184,.25); margin: 0 2px; flex-shrink: 0; }
  .swatch {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer;
    transition: transform .1s; flex-shrink: 0;
  }
  .swatch:active { transform: scale(.85); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .size-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(148,163,184,.25);
    background: rgba(15,23,42,.5); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; transition: all .12s;
  }
  .size-btn:hover { border-color: var(--accent); }
  .size-btn.active { background: var(--accent); border-color: var(--accent); }
  .size-btn .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: none; border: none; }
  /* 工具按钮：图标 + 文字标签 */
  .tool-btn {
    min-width: 52px; padding: 5px 7px 4px; border-radius: 10px;
    border: 1px solid rgba(148,163,184,.25); background: rgba(15,23,42,.5); color: var(--text);
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px;
    flex-shrink: 0; transition: all .12s;
  }
  .tool-btn:hover { border-color: var(--accent); background: rgba(99,102,241,.15); }
  .tool-btn .ico { font-size: 17px; line-height: 1.1; }
  .tool-btn .lbl { font-size: 10px; line-height: 1.1; color: var(--muted); }
  .tool-btn.active { background: var(--accent); border-color: var(--accent); }
  .tool-btn.active .lbl { color: #fff; }
  .board-spacer { flex: 1; }
  .board-btn {
    padding: 7px 11px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 12.5px; font-weight: 600; flex-shrink: 0; transition: all .12s;
  }
  .board-btn.send { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; }
  .board-btn.ghost { background: rgba(148,163,184,.15); color: var(--text); }
  .board-btn.ghost:hover { background: rgba(148,163,184,.3); }
  .board-btn.active { background: var(--accent); color: #fff; box-shadow: 0 0 0 2px rgba(99,102,241,.35); }
  #board-canvas {
    background: #fff; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.5);
    touch-action: none; max-width: 100%; max-height: 70vh; aspect-ratio: 3 / 2;
  }
  /* 画布容器：素材待放置层的定位基准 */
  #board-canvas-wrap { position: relative; display: inline-block; line-height: 0; font-size: 0; max-width: 100%; }
  #board-pending-layer { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .pending-sticker {
    position: absolute; pointer-events: auto; cursor: move; touch-action: none;
    border: 2px dashed var(--accent); border-radius: 10px;
    background: rgba(99,102,241,.08); user-select: none;
  }
  .pending-sticker.dragging { cursor: grabbing; }
  .pending-sticker img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .pending-resize {
    position: absolute; right: -9px; bottom: -9px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--accent); border: 2px solid #fff;
    cursor: nwse-resize; touch-action: none;
  }
  .pending-rotate {
    position: absolute; left: -9px; top: -9px; width: 20px; height: 20px;
    border-radius: 50%; background: #f59e0b; border: 2px solid #fff;
    cursor: grab; touch-action: none; font-size: 11px; color: #fff; line-height: 1;
    display: flex; align-items: center; justify-content: center; user-select: none;
  }
  .pending-actions {
    position: absolute; left: 50%; top: -36px; transform: translateX(-50%);
    display: flex; gap: 6px; line-height: 1;
  }
  .pending-actions button {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff;
    font-size: 15px; cursor: pointer; padding: 0; box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  #board-pending-ok { background: #22c55e; color: #fff; }
  #board-pending-cancel { background: #ef4444; color: #fff; }
  /* 窄屏适配 */
  @media (max-width: 640px) {
    .tool-btn { min-width: 46px; padding: 4px 5px 3px; }
    .tool-btn .ico { font-size: 15px; }
    .tool-btn .lbl { font-size: 9px; }
    .board-btn { padding: 6px 8px; font-size: 11.5px; }
    #board-canvas { max-height: 56vh; }
  }
  /* 画板 emoji 选择条 */
  #board-emoji-bar {
    display: none; width: 100%; max-width: 900px; max-height: 88px; overflow-x: auto; overflow-y: hidden;
    background: var(--panel); border: 1px solid rgba(148,163,184,.2); border-radius: 12px;
    padding: 6px 8px; margin-bottom: 10px; white-space: nowrap;
  }
  #board-emoji-bar.show { display: block; }
  #board-emoji-bar .be-btn {
    background: none; border: none; cursor: pointer; font-size: 26px; padding: 4px 6px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; transition: background .15s;
  }
  #board-emoji-bar .be-btn:hover { background: rgba(148,163,184,.2); }
  #board-emoji-bar .be-btn.active { background: var(--accent); }

  /* 画板升级：模板/主题/配色面板 */
  .board-popup-panel {
    display: none; width: 100%; max-width: 900px;
    background: var(--panel); border: 1px solid rgba(148,163,184,.2); border-radius: 12px;
    padding: 10px; margin-bottom: 10px; gap: 10px; flex-wrap: wrap;
  }
  .board-popup-panel.show { display: flex; }
  .panel-title { font-size: 12px; color: var(--muted); margin-right: 4px; align-self: center; }
  #board-template-panel {
    /* 侧边抽屉：展开时覆盖在右侧，不再挤压画布 */
    position: fixed; top: 12px; right: 12px; bottom: 12px;
    width: min(340px, 88vw); max-width: 340px; max-height: none;
    margin: 0; z-index: 60;
    flex-direction: column; flex-wrap: nowrap; overflow-y: auto;
    box-shadow: 0 12px 48px rgba(0,0,0,.55);
  }
  #template-hide { margin-left: auto; }
  #board-template-panel .sticker-hint { flex: 1 1 100%; min-width: 0; order: 3; line-height: 1.5; }
  /* 磨耳朵：点素材时左侧弹出英语单词 */
  #board-word-card {
    position: fixed; left: max(16px, calc(50% - 450px)); top: 50%;
    transform: translateY(-50%); z-index: 55; pointer-events: none;
    display: flex; flex-direction: column; align-items: flex-start;
    padding: 16px 24px; border-radius: 20px; opacity: 0;
    background: linear-gradient(135deg, rgba(99,102,241,.96), rgba(139,92,246,.96));
    box-shadow: 0 16px 40px rgba(0,0,0,.45); color: #fff; max-width: 42vw;
  }
  #board-word-card.show { opacity: 1; animation: wordPop .3s cubic-bezier(.34,1.56,.64,1); }
  .bwc-speaker { font-size: 15px; opacity: .9; margin-bottom: 4px; }
  .bwc-en { font-size: clamp(30px, 4.4vw, 54px); font-weight: 800; line-height: 1.05; letter-spacing: .5px; word-break: break-word; }
  .bwc-zh { font-size: 14px; opacity: .85; margin-top: 6px; }
  @keyframes wordPop { from { opacity: 0; transform: translateY(-50%) scale(.7); } to { opacity: 1; transform: translateY(-50%) scale(1); } }
  @media (max-width: 640px) { #board-word-card { left: 12px; max-width: 62vw; padding: 12px 16px; } }
  .sticker-head { display: flex; align-items: center; gap: 8px; width: 100%; flex-wrap: wrap; }
  .sticker-hint { font-size: 11px; color: var(--muted); flex: 1; min-width: 160px; }
  .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px,1fr)); gap: 6px; flex: 1; width: 100%; }
  .sticker-cat {
    grid-column: 1 / -1; font-size: 11px; color: var(--muted);
    border-bottom: 1px dashed rgba(148,163,184,.25); padding: 2px 0 3px; margin-top: 2px;
  }
  .sticker-item {
    background: rgba(148,163,184,.1); border: 1px solid rgba(148,163,184,.25); border-radius: 10px;
    padding: 5px 3px 3px; cursor: pointer; text-align: center; transition: transform .1s, border-color .1s;
  }
  .sticker-item:hover { transform: scale(1.06); border-color: var(--accent); background: rgba(99,102,241,.14); }
  .sticker-item:active { transform: scale(.94); }
  .sticker-item svg { width: 100%; height: 44px; display: block; }
  .sticker-item .st-name { font-size: 10px; color: var(--muted); margin-top: 1px; line-height: 1.2; }
  .theme-btn, .palette-set-btn {
    padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(148,163,184,.25);
    background: rgba(15,23,42,.5); color: var(--text); cursor: pointer; font-size: 12px;
    display: flex; align-items: center; gap: 4px;
  }
  .theme-btn.active, .palette-set-btn.active { background: var(--accent); border-color: var(--accent); }
  .theme-sep { font-size: 11px; color: var(--muted); align-self: center; margin: 0 2px 0 8px; }
  .palette-set { display: flex; gap: 3px; margin-top: 4px; }
  .palette-dot { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); cursor: pointer; }
  #board-canvas.theme-blackboard { background: #1e293b; }
  #board-canvas.theme-paper { background: #fef3c7; }
  #board-canvas.theme-pink { background: #fce7f3; }
  #board-canvas.theme-bluegrid { background: #ffffff; }

  /* Toast */

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function () {
  "use strict";

  // ===== 配置 =====
  // 公共 MQTT broker（WSS），任何人都可连接；同一房间 topic 即可互通
  var BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
  var TOPIC_PREFIX = "trae-chat-v1/";   // 房间 topic 前缀

  // ===== Emoji 集 =====
  var EMOJI = {
    "表情": "😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😋 😛 😜 🤪 😝 🤗 🤭 🤫 🤔 🤐 😐 😑 😶 😏 😒 🙄 😬 😔 😪 🤤 😴 😷 🤒 🤕 🤢 🤮 🥵 🥶 😎 🤓 🧐 😕 😟 🙁 😮 😯 😲 😳 🥺 😢 😭 😱 😨 😰 😡 😠 🤬 😈 👿 💀 💩 🤡 👻 👽 🤖".split(" "),
    "手势": "👍 👎 👊 ✊ 🤛 🤜 👏 🙌 👐 🤲 🙏 🤝 💪 👋 🤚 🖐 ✋ 🖖 👌 🤌 🤏 ✌️ 🤞 🤟 🤘 👈 👉 👆 👇 ☝️ ✍️".split(" "),
    "心情": "❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 💟 💯 🔥 ⭐ 🌟 ✨ ⚡ 💥 💢 💧 💦".split(" "),
    "动物": "🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🦄 🐝 🦋 🐌 🐞 🐢 🐙 🦕 🦖 🐬 🐳 🐋".split(" "),
    "食物": "🍎 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍈 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🥑 🍆 🥔 🥕 🌽 🌶 🥦 🍞 🧀 🥚 🍳 🥞 🍔 🍟 🍕 🌭 🍣 🍦 🍰 🍩 🍪 ☕ 🍺 🍷".split(" "),
    "活动": "⚽ 🏀 🏈 ⚾ 🎾 🏐 🏉 🎱 🏓 🏸 🥅 🏒 🏑 🥍 🏏 ⛳ 🎯 🎮 🕹 🎲 🎰 🎳 🎪 🎭 🎨 🎬 🎤 🎧 🎼 🎹 🥁 🎸 🎻 🏆 🥇 🎉 🎊 🎈 🎁".split(" "),
    "旅行": "🚗 🚕 🚙 🚌 🏎 🚓 🚑 🚒 🚚 🚲 🛵 🏍 ✈️ 🚀 🛸 🚁 ⛵ 🚤 🛳 ⛴ 🚂 🚆 🚊 🚉 🗼 🗽 🗿 🏰 🏯 🎡 🎢 🏖 🏔 🌋 🏕 🌅 🌄 🌠".split(" "),
    "物品": "💎 🔑 🔒 🔓 🛒 💰 💴 💵 💶 💷 💸 💳 🧲 🔫 💣 🧨 🪓 🔪 🗡 ⚔️ 🛡 🚬 ⛓ 🧷 🧹 🧺 🧻 📱 💻 ⌨️ 🖥 🖨 📷 🎥 📺 📡 ⏰ ⏳".split(" ")
  };

  // ===== 状态 =====
  var client = null;
  var nick = "";
  var room = "";
  var topic = "";
  var connected = false;
  var autoScroll = true;

  // ===== DOM =====
  var $ = function (id) { return document.getElementById(id); };
  var gate = $("gate"), app = $("app");
  var nickInput = $("nick-input"), roomInput = $("room-input"), enterBtn = $("enter-btn");
  var roomName = $("room-name"), statusDot = $("status-dot"), statusText = $("status-text");
  var leaveBtn = $("leave-btn");
  var messagesEl = $("messages");
  var textEl = $("text"), sendBtn = $("send");
  var emojiBtn = $("emoji-btn"), emojiPanel = $("emoji-panel"), emojiContent = $("emoji-content");
  var mqttLib = (typeof mqtt !== "undefined") ? mqtt : (window.mqtt || null);

  // ===== 工具 =====
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function nowTime() {
    var d = new Date();
    function p(n) { return n < 10 ? "0" + n : n; }
    return p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function isEmojiOnly(str) {
    // 去除空白后，全是 emoji/符号字符
    var s = str.replace(/\s/g, "");
    if (!s) return false;
    // 简单判定：每个字符都落在常见 emoji 区间或为变体选择符
    var re = /^(\p{Extended_Pictographic}|\p{Emoji_Component}|\u200d|\ufe0f)+$/u;
    return re.test(s);
  }
  function renderEmoji(text) {
    // 给所有 emoji 字符套 span 以便放大样式（保持文字小，emoji 大）
    var re = /(\p{Extended_Pictographic}(\p{Emoji_Component}|\u200d|\ufe0f)*)/gu;
    return esc(text).replace(re, '<span class="big-emoji">$1</span>');
  }

  // ===== 入场 =====
  // 回填已保存的昵称
  try {
    var savedNick = localStorage.getItem("yychat_nick");
    if (savedNick) nickInput.value = savedNick;
  } catch (e) {}
  enterBtn.addEventListener("click", enter);
  [nickInput, roomInput].forEach(function (el) {
    el.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) enter(); });
  });
  function enter() {
    nick = nickInput.value.trim() || "匿名";
    room = roomInput.value.trim() || "悠悠的聊天室";
    // 记住昵称到本地，刷新后自动回填
    try { localStorage.setItem("yychat_nick", nick); } catch (e) {}
    // topic 仅允许字母数字下划线中划线
    var safeRoom = room.replace(/[^a-zA-Z0-9_\-]/g, "-").slice(0, 32) || "lobby";
    topic = TOPIC_PREFIX + safeRoom;
    roomName.textContent = room;
    gate.style.display = "none";
    app.classList.add("show");
    // 请求通知权限（异步，不阻塞进入）
    requestNotifyPerm();
    connect();
  }

  // ===== 浏览器通知（通过 Service Worker，点击可聚焦已打开页面）=====
  var swReg = null;
  function requestNotifyPerm() {
    try {
      if (!("Notification" in window)) return;
      // 先注册 Service Worker（用于处理通知点击）
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").then(function (reg) {
          swReg = reg;
          // 监听 SW 发来的点击消息，切回聊天视图
          navigator.serviceWorker.addEventListener("message", function (ev) {
            if (ev.data && ev.data.type === "notif-click") switchToChat();
          });
          if (Notification.permission === "default") Notification.requestPermission();
        }).catch(function () {
          // SW 注册失败，回退到原生通知
          if (Notification.permission === "default") Notification.requestPermission();
        });
      } else {
        if (Notification.permission === "default") Notification.requestPermission();
      }
    } catch (e) {}
  }
  function notify(title, body) {
    try {
      if (!("Notification" in window)) return;
      if (Notification.permission !== "granted") return;
      // 仅当页面隐藏或不在聊天视图时弹通知，避免打扰当前聊天
      var notInChat = document.hidden || (chatView && chatView.style.display === "none");
      if (!notInChat) return;
      var opts = { body: body, tag: "yychat-msg", renotify: true, icon: undefined };
      // 优先用 SW 的 showNotification（点击行为受 SW 控制，能聚焦已开页面）
      if (swReg) {
        swReg.showNotification(title, opts);
      } else {
        var n = new Notification(title, opts);
        n.onclick = function () {
          try { window.focus(); } catch (e) {}
          switchToChat();
          n.close();
        };
        setTimeout(function () { try { n.close(); } catch (e) {} }, 4000);
      }
    } catch (e) {}
  }
  function switchToChat() {
    try {
      if (!chatView) return;
      chatView.style.display = "";
      gamesView.classList.remove("show");
      navBtns.forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-view") === "chat");
      });
    } catch (e) {}
  }

  // ===== 钉钉机器人推送 =====
  // 安全：webhook access_token 只存在服务端环境变量，前端只走 /api/dingtalk 代理
  var DING_API = "/api/dingtalk";

  // 创建钉钉状态指示器
  function createDingIcon() {
    var el = document.createElement("span");
    el.className = "ding-icon pending show";
    el.textContent = "●";
    el.title = "推送到钉钉中…";
    return el;
  }
  function setDingStatus(icon, status, msg) {
    if (!icon) return;
    icon.classList.remove("pending", "success", "error");
    if (status === "success") {
      icon.classList.add("success");
      icon.textContent = "✓";
      icon.title = msg || "已推送到钉钉";
    } else if (status === "error") {
      icon.classList.add("error");
      icon.textContent = "✗";
      icon.title = msg || "推送失败";
    } else {
      icon.classList.add("pending");
      icon.textContent = "●";
      icon.title = msg || "推送中…";
    }
    console.log("[钉钉推送]", status, msg);
  }

  // 推送到钉钉；dingIcon 存在则更新 UI；msgId 用作去重 tag
  function pushDing(title, content, dingIcon, msgId) {
    var tag = msgId || ("t" + Date.now() + "_" + Math.random().toString(36).slice(2, 6));
    var updateIcon = function (status, msg) {
      if (dingIcon) setDingStatus(dingIcon, status, msg);
    };
    // 本地轻量去重（主要去重逻辑在服务端 Function）
    try {
      var KEY = "yychat.ding.pushed.v1";
      var pushed = JSON.parse(localStorage.getItem(KEY) || "{}");
      var now = Date.now();
      Object.keys(pushed).forEach(function (k) { if (pushed[k] < now) delete pushed[k]; });
      if (pushed[tag]) { updateIcon("success", "已推（去重）"); return; }
      pushed[tag] = now + 180000;
      localStorage.setItem(KEY, JSON.stringify(pushed));
    } catch (e) {}
    updateIcon("pending", "推送中…");
    try {
      var body = { title: title, content: content || "", tag: tag };
      // 统一走服务端代理 /api/dingtalk，前端不持有 webhook token
      // 本地调试也请用 wrangler pages dev（或等效方式）启动，确保 Function 可用
      fetch(DING_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }).then(function (resp) { return resp.json(); }).then(function (data) {
        if (data && data.errcode === 0) {
          updateIcon("success", data.deduplicated ? "已推（去重）" : "已推送到钉钉");
        } else {
          _unpush(tag);
          updateIcon("error", "钉钉返回错误: " + (data.errmsg || "未知"));
        }
      }).catch(function (e) {
        _unpush(tag);
        updateIcon("error", "推送失败（网络或Function未部署）: " + (e.message || String(e)));
      });
    } catch (e) {
      _unpush(tag);
      updateIcon("error", "推送异常: " + String(e));
    }
  }
  function _unpush(tag) {
    try {
      var KEY = "yychat.ding.pushed.v1";
      var pushed = JSON.parse(localStorage.getItem(KEY) || "{}");
      delete pushed[tag];
      localStorage.setItem(KEY, JSON.stringify(pushed));
    } catch (e) {}
  }

  // ===== MQTT 连接 =====
  function connect() {
    if (!mqttLib) {
      setStatus(false, "MQTT 库加载失败");
      addSys("MQTT 库加载失败，请检查网络后刷新。");
      return;
    }
    setStatus(false, "连接中…");
    var clientId = "trae-chat-" + Math.random().toString(36).slice(2, 10);
    try {
      client = mqttLib.connect(BROKER_URL, {
        clientId: clientId,
        clean: true,
        reconnectPeriod: 3000,
        connectTimeout: 8000,
        keepalive: 30
      });
    } catch (e) {
      setStatus(false, "连接失败");
      addSys("连接失败：" + esc(e.message || String(e)));
      return;
    }

    client.on("connect", function () {
      connected = true;
      setStatus(true, "已连接");
      client.subscribe(topic, { qos: 0 }, function (err) {
        if (err) { addSys("订阅房间失败"); }
        else {
          addSys("已进入房间「" + esc(room) + "」");
          // 广播加入
          publish({ type: "sys", text: nick + " 加入了房间", t: Date.now() });
        }
      });
    });

    client.on("reconnect", function () { setStatus(false, "重连中…"); });
    client.on("close", function () { connected = false; setStatus(false, "已断开"); });
    client.on("error", function (err) { setStatus(false, "错误"); addSys("连接错误：" + esc(err.message || String(err))); });

    client.on("message", function (t, payload) {
      try {
        var msg = JSON.parse(payload.toString());
        onMessage(msg);
      } catch (e) { /* 忽略非法消息 */ }
    });
  }

  function publish(msg) {
    if (!client || !connected) return;
    try { client.publish(topic, JSON.stringify(msg), { qos: 0 }); } catch (e) {}
  }

  function onMessage(msg) {
    if (!msg || !msg.type) return;
    if (msg.type === "sys") {
      addSys(msg.text || "");
    } else if (msg.type === "chat") {
      var isSelf = msg.id && lastSentId === msg.id;
      if (isSelf) lastSentId = null;
      var fromNick = msg.nick || "匿名";
      var msgText = msg.text || "";
      console.log("[onMessage] 收到消息:", fromNick, msgText, "isSelf:", isSelf);
      // 只有别人的消息才渲染 UI（自己的发送时已渲染过）
      // 推送钉钉只由发送方负责，接收方不再调用 pushDing，彻底避免 N 端并发重复推送
      if (!isSelf) {
        // 接收方消息不显示钉钉状态图标（推送请求不在接收方发生）
        addChat(fromNick, msgText, msg.t || Date.now(), false, null);
        notify(fromNick + " 来了新消息", msgText);
      }
    } else if (msg.type === "image") {
      var isSelfImg = msg.id && lastSentId === msg.id;
      if (isSelfImg) lastSentId = null;
      var imgNick = msg.nick || "匿名";
      console.log("[onMessage] 收到图片:", imgNick, "isSelf:", isSelfImg);
      if (!isSelfImg) {
        // 接收方消息不显示钉钉状态图标
        addImage(imgNick, msg.data || "", msg.t || Date.now(), false, null);
        notify(imgNick + " 发来图片", "点击查看");
      }
    }
  }

  function send() {
    var text = textEl.value;
    if (!text.trim() || !connected) return;
    var id = Math.random().toString(36).slice(2, 10);
    lastSentId = id;
    var msg = { type: "chat", id: id, nick: nick, text: text, t: Date.now() };
    publish(msg);
    // 发送方自己负责推送钉钉：一条消息只有发送者这一台设备会触发 pushDing，
    // 天然避免 N 个接收端并发导致的重复推送问题
    var dingIcon = createDingIcon();
    addChat(nick, text, msg.t, true, dingIcon);
    pushDing("【悠悠聊天室】" + nick, "[" + room + "] " + nick + ":\n" + text, dingIcon, id);
    textEl.value = "";

  // ===== emoji 飞入动效 =====
  var flyingCount = 0;
  function flyEmoji(bubble, text, isMe) {
    if (document.hidden) return false;
    if (flyingCount > 8) return false;
    var rect = bubble.getBoundingClientRect();
    if (rect.bottom < -10 || rect.top > window.innerHeight + 10) return false;
    var endX = rect.left + rect.width / 2;
    var endY = rect.top + rect.height / 2;

    var W = window.innerWidth, H = window.innerHeight;

    // 飞入 emoji 用固定中等尺寸（96px），避免占满屏幕
    var FLY_FS = 96;

    // 起点：自己发的从右下角飞出，别人发的从左/上边缘飞入
    var startX, startY;
    if (isMe) { startX = W * 0.85; startY = H + 40; }
    else { startX = -40; startY = H * (0.1 + Math.random() * 0.4); }

    // —— 5~7 个全屏路点，覆盖四角+中心 ——
    var nWay = 5 + Math.floor(Math.random() * 3);
    var landmarks = [
      { x: W * 0.1,  y: H * 0.15 },  // 左上
      { x: W * 0.9,  y: H * 0.15 },  // 右上
      { x: W * 0.1,  y: H * 0.85 },  // 左下
      { x: W * 0.9,  y: H * 0.85 },  // 右下
      { x: W * 0.5,  y: H * 0.25 },  // 上中
      { x: W * 0.5,  y: H * 0.75 },  // 下中
      { x: W * 0.3,  y: H * 0.5  },  // 左中
      { x: W * 0.7,  y: H * 0.5  }   // 右中
    ];
    // 打乱取前 nWay 个
    var shuffled = landmarks.slice().sort(function () { return Math.random() - 0.5; });
    var ways = [];
    for (var i = 0; i < nWay; i++) {
      var c = shuffled[i];
      ways.push({
        x: c.x + (Math.random() * 2 - 1) * W * 0.06,
        y: c.y + (Math.random() * 2 - 1) * H * 0.06,
        rot: (Math.random() * 2 - 1) * 720,
        bounce: 0.55 + Math.random() * 0.85
      });
    }

    var el = document.createElement("div");
    el.className = "fly-emoji";
    el.textContent = text;
    el.style.fontSize = FLY_FS + "px";
    el.style.opacity = "0";
    // 创建后立即定位到起点，避免首帧在 (0,0) 处闪现
    el.style.transform = "translate(-50%,-50%) translate(" + startX + "px," + startY + "px) scale(0.6) rotate(0deg)";
    document.body.appendChild(el);
    flyingCount++;

    var lastWay = ways[ways.length - 1];
    var side = endX > W / 2 ? 1 : -1;
    var ctrlX = (lastWay.x + endX) / 2 + side * (100 + Math.random() * 100);
    var ctrlY = Math.min(lastWay.y, endY) - (80 + Math.random() * 120);

    var dur = 2200;
    var t0 = performance.now();
    var runRatio = 0.82;
    var finished = false;

    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

    function cleanup() {
      if (finished) return;
      finished = true;
      el.remove();
      flyingCount = Math.max(0, flyingCount - 1);
      bubble.style.opacity = "";
      bubble.classList.remove("pop-in");
      void bubble.offsetWidth;
      bubble.classList.add("pop-in");
    }

    function frame(now) {
      try {
        var t = Math.min(1, (now - t0) / dur);
        var x, y, rot, s;

        if (t < runRatio) {
          var segs = ways.length;
          var tt = Math.min(0.9999, t / runRatio);
          var seg = tt * segs;
          var i0 = Math.min(segs - 1, Math.floor(seg));
          var localT = seg - i0;
          var eT = easeInOut(localT);
          var p0 = i0 === 0 ? { x: startX, y: startY, rot: 0, bounce: 1 } : ways[i0 - 1];
          var p1 = ways[i0];
          x = lerp(p0.x, p1.x, eT);
          y = lerp(p0.y, p1.y, eT);
          rot = lerp(p0.rot, p1.rot, eT);
          var bounce = lerp(p0.bounce, p1.bounce, eT);
          s = bounce * (0.7 + Math.sin(localT * Math.PI) * 0.7);
        } else {
          var ft = (t - runRatio) / (1 - runRatio);
          var e = 1 - Math.pow(1 - ft, 3);
          var u = 1 - e;
          x = u * u * lastWay.x + 2 * u * e * ctrlX + e * e * endX;
          y = u * u * lastWay.y + 2 * u * e * ctrlY + e * e * endY;
          rot = lerp(lastWay.rot, 0, e);
          s = lastWay.bounce + (1 - lastWay.bounce) * e;
          if (ft < 0.7) s *= 1 + Math.sin(ft / 0.7 * Math.PI) * 0.2;
        }

        el.style.transform = "translate(-50%,-50%) translate(" + x + "px," + y + "px) scale(" + s + ") rotate(" + rot + "deg)";
        el.style.opacity = t < 0.92 ? 1 : (1 - (t - 0.92) / 0.08);

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          cleanup();
        }
      } catch (err) {
        cleanup();
      }
    }
    // 安全超时：3.5 秒后强制清理，防止任何情况下卡住
    setTimeout(function () { if (!finished) cleanup(); }, 3500);
    requestAnimationFrame(frame);
    return true;
  }

  function undoBoard() {
    if (boardHistory.length === 0) return;
    bctx.putImageData(boardHistory.pop(), 0, 0);
  }

  $("board-tools").addEventListener("click", function (e) {
    var b = e.target.closest(".tool-btn");
    if (!b) return;
    Array.prototype.forEach.call($("board-tools").querySelectorAll(".tool-btn"), function (x) { x.classList.remove("active"); });
    b.classList.add("active");
    drawState.tool = b.getAttribute("data-tool");
    if (drawState.tool === "emoji") boardEmojiBar.classList.add("show");
    else boardEmojiBar.classList.remove("show");
  });
  $("board-colors").addEventListener("click", function (e) {
    var s = e.target.closest(".swatch");
    if (!s) return;
    Array.prototype.forEach.call($("board-colors").querySelectorAll(".swatch"), function (x) { x.classList.remove("active"); });
    s.classList.add("active");
    drawState.color = s.getAttribute("data-color");
  });
  $("board-sizes").addEventListener("click", function (e) {
    var b = e.target.closest(".size-btn");
    if (!b) return;
    Array.prototype.forEach.call($("board-sizes").querySelectorAll(".size-btn"), function (x) { x.classList.remove("active"); });
    b.classList.add("active");
    drawState.size = parseInt(b.getAttribute("data-size"), 10) || 4;
  });

  function getPos(e) {
    var rect = boardCanvas.getBoundingClientRect();
    var cx, cy;
    if (e.touches && e.touches[0]) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    return { x: (cx - rect.left) * (boardCanvas.width / rect.width), y: (cy - rect.top) * (boardCanvas.height / rect.height) };
  }
  function startDraw(e) {
    e.preventDefault();
    var p = getPos(e);
    pushHistory();
    // emoji 工具：点击即放置，无需拖动
    if (drawState.tool === "emoji") {
      var sizeMap = { 4: 44, 8: 72, 14: 104 };
      bctx.font = (sizeMap[drawState.size] || 48) + "px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
      bctx.textAlign = "center";
      bctx.textBaseline = "middle";
      bctx.fillText(drawState.emojiChar || "😀", p.x, p.y);
      drawState.drawing = false;
      return;
    }
    drawState.drawing = true;
    drawState.startX = p.x; drawState.startY = p.y;
    if (drawState.tool === "line" || drawState.tool === "rect" || drawState.tool === "circle") {
      drawState.snapshot = bctx.getImageData(0, 0, boardCanvas.width, boardCanvas.height);
    }
    if (drawState.tool === "pen" || drawState.tool === "eraser") {
      bctx.beginPath();
      bctx.moveTo(p.x, p.y);
    }
  }
  function moveDraw(e) {
    if (!drawState.drawing) return;
    e.preventDefault();
    var p = getPos(e);
    bctx.lineCap = "round"; bctx.lineJoin = "round";
    bctx.lineWidth = drawState.size;
    bctx.strokeStyle = drawState.tool === "eraser" ? "#ffffff" : drawState.color;
    if (drawState.tool === "pen" || drawState.tool === "eraser") {
      bctx.lineTo(p.x, p.y); bctx.stroke();
    } else if (drawState.snapshot) {
      bctx.putImageData(drawState.snapshot, 0, 0);
      bctx.beginPath();
      if (drawState.tool === "line") { bctx.moveTo(drawState.startX, drawState.startY); bctx.lineTo(p.x, p.y); bctx.stroke(); }
      else if (drawState.tool === "rect") { bctx.strokeRect(drawState.startX, drawState.startY, p.x - drawState.startX, p.y - drawState.startY); }
      else if (drawState.tool === "circle") {
        var dx = p.x - drawState.startX, dy = p.y - drawState.startY;
        bctx.arc(drawState.startX, drawState.startY, Math.sqrt(dx * dx + dy * dy), 0, Math.PI * 2);
        bctx.stroke();
      }
    }
  }
  function endDraw() { drawState.drawing = false; drawState.snapshot = null; }

  // wrapper 模式：后续可通过重写 _xxxImpl 来替换实现
  var _startDrawImpl = startDraw, _moveDrawImpl = moveDraw, _endDrawImpl = endDraw;
  boardCanvas.addEventListener("mousedown", function(e){ _startDrawImpl(e); });
  boardCanvas.addEventListener("mousemove", function(e){ _moveDrawImpl(e); });
  window.addEventListener("mouseup", function(e){ _endDrawImpl(e); });
  boardCanvas.addEventListener("touchstart", function(e){ _startDrawImpl(e); }, { passive: false });
  boardCanvas.addEventListener("touchmove", function(e){ _moveDrawImpl(e); }, { passive: false });
  window.addEventListener("touchend", function(e){ _endDrawImpl(e); });

  var _undoImpl = undoBoard; // 留着后面赋值替换
  $("board-undo").addEventListener("click", function(){ _undoImpl(); });
  $("board-close").addEventListener("click", function () { commitPendingSticker(); board.classList.remove("show"); });
  boardBtn.addEventListener("click", function () { board.classList.add("show"); });

  $("board-send").addEventListener("click", function () {
    if (!connected) { addSys("未连接，无法发送"); return; }
    // 先把手上的素材落定，再截图，否则会漏掉
    commitPendingSticker(function () {
      var dataUrl = boardCanvas.toDataURL("image/jpeg", 0.7);
      if (dataUrl.length > 120000) dataUrl = boardCanvas.toDataURL("image/jpeg", 0.45);
      var id = Math.random().toString(36).slice(2, 10);
      lastSentId = id;
      var msg = { type: "image", id: id, nick: nick, data: dataUrl, t: Date.now() };
      publish(msg);
      var dingIcon = createDingIcon();
      addImage(nick, dataUrl, msg.t, true, dingIcon);
      pushDing("【悠悠聊天室】" + nick, "[" + room + "] " + nick + " 发来图片（画板作品）", dingIcon, id);
      showBoardToast("🎉 发送啦！");
      spawnBoardConfetti(15);
      board.classList.remove("show");
      clearBoard();
      boardHistory.length = 0;
      boardRedoHistory.length = 0;
    });
  });

  // --- 油漆桶：扫描线洪水填充（封闭区域内快速上色） ---
  function hexToRgba(hex) {
    var h = String(hex || "#000000").replace("#", "").trim();
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (h.length !== 6) return [0, 0, 0, 255];
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    if (isNaN(r) || isNaN(g) || isNaN(b)) return [0, 0, 0, 255];
    return [r, g, b, 255];
  }

  function floodFill(sx, sy, hexColor) {
    var w = boardCanvas.width, h = boardCanvas.height;
    sx = Math.floor(sx); sy = Math.floor(sy);
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) return;
    var img, d;
    try { img = bctx.getImageData(0, 0, w, h); d = img.data; } catch (e) { return; }

    var fill = hexToRgba(hexColor);
    var ti = (sy * w + sx) * 4;
    var tr = d[ti], tg = d[ti + 1], tb = d[ti + 2], ta = d[ti + 3];
    // 点到的位置已经是目标色 → 不重复填充
    if (Math.abs(tr - fill[0]) <= 4 && Math.abs(tg - fill[1]) <= 4 && Math.abs(tb - fill[2]) <= 4) return;

    var tol = 40;               // 容差：吃掉抗锯齿边缘，但撞到深色线就停
    var visited = new Uint8Array(w * h);
    var stack = [[sx, sy]];

    function match(i4) {
      return Math.abs(d[i4] - tr) <= tol && Math.abs(d[i4 + 1] - tg) <= tol &&
             Math.abs(d[i4 + 2] - tb) <= tol && Math.abs(d[i4 + 3] - ta) <= tol;
    }
    function scanRow(ny, x1, x2) {
      var nrow = ny * w, inRun = false;
      for (var xx = x1; xx <= x2; xx++) {
        var ok = !visited[nrow + xx] && match((nrow + xx) * 4);
        if (ok) { if (!inRun) { stack.push([xx, ny]); inRun = true; } }
        else inRun = false;
      }
    }

    while (stack.length) {
      var pt = stack.pop(), x = pt[0], y = pt[1];
      var row = y * w;
      if (visited[row + x] || !match((row + x) * 4)) continue;

      var x1 = x;
      while (x1 >= 0 && !visited[row + x1] && match((row + x1) * 4)) x1--;
      x1++;
      var x2 = x;
      while (x2 < w && !visited[row + x2] && match((row + x2) * 4)) x2++;
      x2--;

      for (var xx2 = x1; xx2 <= x2; xx2++) {
        var i4 = (row + xx2) * 4;
        d[i4] = fill[0]; d[i4 + 1] = fill[1]; d[i4 + 2] = fill[2]; d[i4 + 3] = 255;
        visited[row + xx2] = 1;
      }
      if (y > 0) scanRow(y - 1, x1, x2);
      if (y < h - 1) scanRow(y + 1, x1, x2);
    }
    bctx.putImageData(img, 0, 0);
  }

  // --- 素材贴纸：加载 / 放置 / 面板 ---
  function stickerImg(svg, cb) {
    var cached = stickerCache[svg];
    if (cached) {
      if (cached.complete && (cached.naturalWidth || cached.width)) cb(cached);
      else cached.addEventListener("load", function () { cb(cached); }, { once: true });
      return;
    }
    var img = new Image();
    // data URI 必须带 xmlns 和明确宽高，否则 img 尺寸为 0 画不出来
    var full = svg.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" ');
    img.onload = function () { stickerCache[svg] = img; cb(img); };
    img.onerror = function () { showBoardToast("素材加载失败"); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(full);
  }

  function stickerSize() {
    return drawState.size === 14 ? 180 : (drawState.size === 8 ? 130 : 90);
  }

  function placeStickerAt(svg, x, y, size, rot, done) {
    stickerImg(svg, function (img) {
      bctx.save();
      bctx.translate(x, y);
      if (rot) bctx.rotate(rot * Math.PI / 180);
      bctx.drawImage(img, -size / 2, -size / 2, size, size);
      bctx.restore();
      if (done) done();
    });
  }

  // --- 待放置素材：可以先拖动位置、拉角缩放，再点 ✓ 落到画布 ---
  var pendingEl = null;
  var pendingState = null;   // { svg, name, x, y, size } x/y 为中心点，单位是 CSS 像素

  function pendingScale() {
    var w = pendingLayer.clientWidth || boardCanvas.clientWidth || 0;
    return w ? boardCanvas.width / w : 1;
  }

  function layoutPending() {
    if (!pendingEl || !pendingState) return;
    var s = pendingState.size;
    pendingEl.style.left = (pendingState.x - s / 2) + "px";
    pendingEl.style.top = (pendingState.y - s / 2) + "px";
    pendingEl.style.width = s + "px";
    pendingEl.style.height = s + "px";
    var img = pendingEl.querySelector("img");
    if (img) img.style.transform = "rotate(" + (pendingState.rot || 0) + "deg)";
  }

  function clampPending() {
    var st = pendingState, W = pendingLayer.clientWidth, H = pendingLayer.clientHeight;
    var half = st.size / 2;
    st.x = Math.max(half, Math.min(W - half, st.x));
    st.y = Math.max(half, Math.min(H - half, st.y));
  }

  function ensurePendingEl() {
    if (pendingEl) return pendingEl;
    var el = document.createElement("div");
    el.className = "pending-sticker";
    el.innerHTML =
      '<img alt="">' +
      '<div class="pending-rotate" title="拖动旋转">↻</div>' +
      '<div class="pending-resize" title="拖动调整大小"></div>' +
      '<div class="pending-actions">' +
      '<button type="button" id="board-pending-ok" title="放到画布上">✓</button>' +
      '<button type="button" id="board-pending-cancel" title="不要这个">✕</button>' +
      "</div>";
    pendingLayer.appendChild(el);
    pendingEl = el;

    el.querySelector("#board-pending-ok").addEventListener("click", function (e) {
      e.stopPropagation();
      commitPendingSticker();
    });
    el.querySelector("#board-pending-cancel").addEventListener("click", function (e) {
      e.stopPropagation();
      discardPendingSticker();
      showBoardToast("取消放置");
    });

    // 拖动位置
    el.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".pending-resize") || e.target.closest(".pending-rotate") || e.target.closest("button")) return;
      e.preventDefault();
      e.stopPropagation();
      var sx = e.clientX, sy = e.clientY;
      var ox = pendingState.x, oy = pendingState.y;
      el.classList.add("dragging");
      el.setPointerCapture(e.pointerId);
      function onMove(ev) {
        if (!pendingState) return;
        pendingState.x = ox + (ev.clientX - sx);
        pendingState.y = oy + (ev.clientY - sy);
        clampPending();
        layoutPending();
      }
      function onUp() {
        el.classList.remove("dragging");
        el.removeEventListener("pointermove", onMove);
        el.removeEventListener("pointerup", onUp);
        el.removeEventListener("pointercancel", onUp);
      }
      el.addEventListener("pointermove", onMove);
      el.addEventListener("pointerup", onUp);
      el.addEventListener("pointercancel", onUp);
    });

    // 拉右下角缩放
    var rz = el.querySelector(".pending-resize");
    rz.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var sx = e.clientX, sy = e.clientY;
      var os = pendingState.size;
      var maxSize = Math.min(pendingLayer.clientWidth, pendingLayer.clientHeight) * 0.9;
      rz.setPointerCapture(e.pointerId);
      function onMove(ev) {
        if (!pendingState) return;
        var d = Math.max(ev.clientX - sx, ev.clientY - sy);
        pendingState.size = Math.max(28, Math.min(maxSize, os + d));
        clampPending();
        layoutPending();
      }
      function onUp() {
        rz.removeEventListener("pointermove", onMove);
        rz.removeEventListener("pointerup", onUp);
        rz.removeEventListener("pointercancel", onUp);
      }
      rz.addEventListener("pointermove", onMove);
      rz.addEventListener("pointerup", onUp);
      rz.addEventListener("pointercancel", onUp);
    });

    // 拖左上角圆点旋转（15° 吸附，方便孩子摆正）
    var rt = el.querySelector(".pending-rotate");
    rt.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var r = el.getBoundingClientRect();
      var cx = r.x + r.width / 2, cy = r.y + r.height / 2;
      var a0 = Math.atan2(e.clientY - cy, e.clientX - cx);
      var base = pendingState.rot || 0;
      rt.setPointerCapture(e.pointerId);
      function onMove(ev) {
        if (!pendingState) return;
        var a = Math.atan2(ev.clientY - cy, ev.clientX - cx);
        var deg = base + (a - a0) * 180 / Math.PI;
        pendingState.rot = ((Math.round(deg / 15) * 15) % 360 + 360) % 360;
        layoutPending();
      }
      function onUp() {
        rt.removeEventListener("pointermove", onMove);
        rt.removeEventListener("pointerup", onUp);
        rt.removeEventListener("pointercancel", onUp);
      }
      rt.addEventListener("pointermove", onMove);
      rt.addEventListener("pointerup", onUp);
      rt.addEventListener("pointercancel", onUp);
    });

    return el;
  }

  function showPendingSticker(s) {
    if (!s) return;
    commitPendingSticker();          // 先落定上一个
    ensurePendingEl();
    var W = pendingLayer.clientWidth, H = pendingLayer.clientHeight;
    if (!W || !H) return;
    var k = pendingScale();
    pendingState = {
      svg: s.svg, name: s.name,
      x: W / 2, y: H / 2,
      size: Math.min(stickerSize() * k, Math.min(W, H) * 0.8),
      rot: 0
    };
    pendingEl.querySelector("img").src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      s.svg.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" ')
    );
    pendingEl.style.display = "block";
    clampPending();
    layoutPending();
    stickerImg(s.svg, function () {});   // 预热缓存，确认时能立刻画上
  }

  function commitPendingSticker(done) {
    if (!pendingEl || !pendingState || pendingEl.style.display === "none") { if (done) done(); return; }
    var k = pendingScale();
    var st = pendingState;
    pushHistory();
    pendingState = null;
    pendingEl.style.display = "none";
    recordBoardAction("sticker", null);
    placeStickerAt(st.svg, st.x * k, st.y * k, st.size * k, st.rot, done);
  }

  function discardPendingSticker() {
    pendingState = null;
    if (pendingEl) pendingEl.style.display = "none";
  }

  // 窗口尺寸变了，待放置素材的像素坐标会失准，直接落定
  window.addEventListener("resize", function () { commitPendingSticker(); });

  // --- 英语磨耳朵：选素材时朗读英文并显示单词 ---
  var wordTimer = null;
  function showWordCard(en, zh) {
    var card = $("board-word-card");
    if (!card) return;
    $("board-word-en").textContent = en || "";
    $("board-word-zh").textContent = zh || "";
    // 贴在画布左侧边、垂直居中显示（跟随画布实际位置）
    var cr = boardCanvas.getBoundingClientRect();
    card.style.left = Math.max(10, Math.round(cr.left + 14)) + "px";
    card.style.top = Math.round(cr.top + cr.height / 2) + "px";
    card.classList.remove("show");
    void card.offsetWidth;
    card.classList.add("show");
    clearTimeout(wordTimer);

      u.rate = 0.82;

  function getCurrentTheme() { return currentTheme; }
  function getBackgroundFill() { return THEMES[currentTheme].fill; }

  function applyBackground(theme) {
    var t = THEMES[theme] || THEMES.white;
    // 清掉所有主题 class（注意：classList.remove("") 会抛异常，必须过滤空字符串）
    Object.keys(THEMES).forEach(function (k) {
      var cls = THEMES[k].canvasClass;
      if (cls) boardCanvas.classList.remove(cls);
    });
    if (t.canvasClass) boardCanvas.classList.add(t.canvasClass);
    bctx.save();
    bctx.globalAlpha = 1;
    bctx.globalCompositeOperation = "source-over";
    // 填底色
    bctx.fillStyle = t.fill;
    bctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
    // 蓝格练习纸的横线
    if (t.grid) {
      bctx.strokeStyle = t.gridColor;
      bctx.lineWidth = 1;
      bctx.beginPath();
      for (var y = 30; y < boardCanvas.height; y += t.gridStep) {
        bctx.moveTo(0, y); bctx.lineTo(boardCanvas.width, y);
      }
      bctx.stroke();
    }
    // 场景背景
    if (t.scene && SCENES[t.scene]) SCENES[t.scene]();
    bctx.restore();
    // 备份纯背景（抠除时用来补回背景，保证画布始终不透明）
    bgCanvas.width = boardCanvas.width;
    bgCanvas.height = boardCanvas.height;
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    bgCtx.drawImage(boardCanvas, 0, 0);
    // 记录场景基线：打分时只算孩子新画的内容，不把背景图案当成画作
    bgSnapshot = null;
    if (t.scene) {
      try { bgSnapshot = bgCtx.getImageData(0, 0, bgCanvas.width, bgCanvas.height).data; } catch (e) {}
    }
  }

    pushHistory();
    currentTheme = theme;

    if (theme === "blackboard" && drawState.color === "#000000") {
      setBoardColor("#ffffff");

  function rebuildColorSwatches(paletteName) {
    var colors = PALETTES[paletteName] || PALETTES.classic;
    var container = $("color-swatches");
    container.innerHTML = "";
    colors.forEach(function (c, i) {
      var s = document.createElement("span");
      s.className = "swatch" + (i === 0 ? " active" : "");
      s.setAttribute("data-color", c);
      s.style.background = c;
      container.appendChild(s);
    });
    drawState.color = colors[0];
    // 重建 palette-show-dots

      showDots.appendChild(d);
    });
  }

  function setBoardColor(hex) {

    var swatches = $("board-colors").querySelectorAll(".swatch");
    var found = false;
    Array.prototype.forEach.call(swatches, function (s) {

    $("board-palette-panel").classList.toggle("show");
  });
  $("board-palette-panel").addEventListener("click", function (e) {
    var btn = e.target.closest(".palette-set-btn");
    if (!btn) return;
    Array.prototype.forEach.call($("board-palette-panel").querySelectorAll(".palette-set-btn"), function (x) { x.classList.remove("active"); });
    btn.classList.add("active");
    rebuildColorSwatches(btn.getAttribute("data-palette"));
  });
  $("board-pick-color").addEventListener("click", function () {
    $("board-color-picker").click();
  });
  $("board-color-picker").addEventListener("input", function () {
    setBoardColor($("board-color-picker").value);
  });

  // --- 重做栈 ---
  var boardRedoHistory = [];
  var _origPushHistory = pushHistory;
  pushHistory = function () {
    try {
      boardHistory.push(bctx.getImageData(0, 0, boardCanvas.width, boardCanvas.height));
      if (boardHistory.length > 30) boardHistory.shift();
      boardRedoHistory.length = 0; // 新操作清空 redo
    } catch (e) {}
  };
  _undoImpl = function () {
    if (boardHistory.length === 0) return;
    try {
      var cur = bctx.getImageData(0, 0, boardCanvas.width, boardCanvas.height);
      boardRedoHistory.push(cur);
      bctx.putImageData(boardHistory.pop(), 0, 0);
    } catch (e) {}
  };
  function redoBoard() {
    if (boardRedoHistory.length === 0) return;
    try {
      var cur = bctx.getImageData(0, 0, boardCanvas.width, boardCanvas.height);
      boardHistory.push(cur);
      bctx.putImageData(boardRedoHistory.pop(), 0, 0);
    } catch (e) {}
  }
  $("board-redo").addEventListener("click", redoBoard);

  // --- 魔法笔刷 / 透明橡皮 ---
  var rainbowHue = 0;
  var smoothMode = true;
  var smoothPoints = [];

  // 重写 startDraw 支持新工具（赋值给 wrapper 变量）
  _startDrawImpl = function (e) {
    e.preventDefault();
    var p = getPos(e);
    // 素材贴纸：画布上点一下 = 把当前待放置素材落定（不额外压历史栈）
    if (drawState.tool === "sticker") {
      drawState.drawing = false;
      if (pendingState) commitPendingSticker();
      else showBoardToast("点 🧩 素材 再选一个");
      return;
    }
    pushHistory();
    // 记录创作行为，供鼓励系统打分
    recordBoardAction(drawState.tool, drawState.color);
    // emoji 工具：点击即放置
    if (drawState.tool === "emoji") {
      var sizeMap = { 4: 44, 8: 72, 14: 104 };
      bctx.font = (sizeMap[drawState.size] || 48) + "px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
      bctx.textAlign = "center"; bctx.textBaseline = "middle";
      bctx.fillText(drawState.emojiChar || "😀", p.x, p.y);
      drawState.drawing = false;
      return;
    }
    // 素材贴纸：在画布上由 startDraw 处理落定，这里不再放置
    // 油漆桶：点一下就填满封闭区域，不需要拖动
    if (drawState.tool === "fill") {
      drawState.drawing = false;
      floodFill(p.x, p.y, drawState.color);
      return;
    }
    drawState.drawing = true;
    drawState.startX = p.x; drawState.startY = p.y;
    drawState.lastStamp = null;
    if (drawState.tool === "rainbow") {
      drawState.rainbowDist = 0;          // 本笔已画距离
      drawState.rainbowLast = null;       // 上一个点
      drawState.rainbowBaseHue = rainbowHue;      // 起笔锁定起始色相
      rainbowHue = (rainbowHue + 47) % 360;       // 下一笔换个起始色
    }
    // 平滑绘制用的上一个原始点 / 上一个中点
    drawState.prevPoint = { x: p.x, y: p.y };
    drawState.prevMid = null;
    drawState.lastPoint = { x: p.x, y: p.y };
    smoothPoints = [p];
    if (drawState.tool === "line" || drawState.tool === "rect" || drawState.tool === "circle") {
      drawState.snapshot = bctx.getImageData(0, 0, boardCanvas.width, boardCanvas.height);
    }
    if (["pen","rainbow","star","heart","eraser","erase-true"].indexOf(drawState.tool) >= 0) {
      bctx.beginPath();
      bctx.moveTo(p.x, p.y);
    }
    // 真擦除设置 composite
    if (drawState.tool === "erase-true") bctx.globalCompositeOperation = "destination-out";
    else bctx.globalCompositeOperation = "source-over";
  };

  // 重写 moveDraw 支持魔法笔刷
  _moveDrawImpl = function (e) {
    if (!drawState.drawing) return;
    e.preventDefault();
    var p = getPos(e);
    var fromPt = drawState.lastPoint || { x: drawState.startX, y: drawState.startY };
    bctx.lineCap = "round"; bctx.lineJoin = "round";
    bctx.lineWidth = drawState.size;

    // 线/矩形/圆形：老逻辑不变
    if (drawState.snapshot && ["line","rect","circle"].indexOf(drawState.tool) >= 0) {
      bctx.putImageData(drawState.snapshot, 0, 0);
      bctx.beginPath();
      bctx.strokeStyle = drawState.color;
      if (drawState.tool === "line") { bctx.moveTo(drawState.startX, drawState.startY); bctx.lineTo(p.x, p.y); bctx.stroke(); }
      else if (drawState.tool === "rect") { bctx.strokeRect(drawState.startX, drawState.startY, p.x - drawState.startX, p.y - drawState.startY); }
      else if (drawState.tool === "circle") {
        var dx = p.x - drawState.startX, dy = p.y - drawState.startY;
        bctx.arc(drawState.startX, drawState.startY, Math.sqrt(dx * dx + dy * dy), 0, Math.PI * 2);
        bctx.stroke();
      }
      return;
    }

    // 彩虹笔：起笔时锁定起始色相，之后颜色只随「已画距离」连续变化（停笔就不变）
    if (drawState.tool === "rainbow") {
      var prevP = drawState.rainbowLast;
      if (prevP) {
        var sx = p.x - prevP.x, sy = p.y - prevP.y;
        drawState.rainbowDist += Math.sqrt(sx * sx + sy * sy);
      }
      drawState.rainbowLast = p;
      var hue = (drawState.rainbowBaseHue + drawState.rainbowDist * 0.7) % 360;
      bctx.strokeStyle = "hsl(" + hue.toFixed(0) + ",90%,55%)";
    } else if (drawState.tool === "eraser") {
      bctx.strokeStyle = "#ffffff";
    } else if (drawState.tool === "erase-true") {
      // globalCompositeOperation 已在 startDraw 设置
    } else {
      bctx.strokeStyle = drawState.color;
    }

    // 星星/爱心：按移动距离节流，每次只撒 1 个，不画主路径线
    if (drawState.tool === "star" || drawState.tool === "heart") {
      var lastStamp = drawState.lastStamp;
      var stampGap = drawState.size * 2 + 14; // 移动够远才撒一颗
      var moved = lastStamp ? Math.sqrt(Math.pow(p.x - lastStamp.x, 2) + Math.pow(p.y - lastStamp.y, 2)) : Infinity;
      if (moved >= stampGap) {
        drawState.lastStamp = p;
        var emoji = drawState.tool === "star" ? "⭐" : "💗";
        var sizeMap2 = { 4: 26, 8: 38, 14: 52 };
        var fs = sizeMap2[drawState.size] || 34;
        bctx.font = fs + "px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
        bctx.textAlign = "center"; bctx.textBaseline = "middle";
        var jx = (Math.random() - 0.5) * 10;
        var jy = (Math.random() - 0.5) * 10;
        bctx.globalCompositeOperation = "source-over";
        bctx.fillText(emoji, p.x + jx, p.y + jy);
      }
      return; // 不画线，只留 emoji
    }

    // 平滑模式：中点二次贝塞尔（上一段终点=上一个中点，控制点=上一个原始点）
    if (smoothMode && ["pen","rainbow","eraser","erase-true"].indexOf(drawState.tool) >= 0) {
      var prevPt = drawState.prevPoint;
      var mid = { x: (prevPt.x + p.x) / 2, y: (prevPt.y + p.y) / 2 };
      var from = drawState.prevMid || prevPt;
      bctx.beginPath();
      bctx.moveTo(from.x, from.y);
      bctx.quadraticCurveTo(prevPt.x, prevPt.y, mid.x, mid.y);
      bctx.stroke();
      drawState.prevMid = mid;
      drawState.prevPoint = p;
    } else {
      // 关键：每段只描自己这一段，否则 stroke() 会用当前颜色重描整条路径，
      // 彩虹笔的起始色会被最新色覆盖（看起来颜色一直在变）。
      bctx.beginPath();
      bctx.moveTo(fromPt.x, fromPt.y);
      bctx.lineTo(p.x, p.y);
      bctx.stroke();
    }
    drawState.lastPoint = p;
  };

  _endDrawImpl = function () {
    // 平滑模式：补上最后半段（中点法只画到两点中间）
    if (drawState.drawing && smoothMode && drawState.prevMid && drawState.prevPoint &&
        ["pen","rainbow","eraser","erase-true"].indexOf(drawState.tool) >= 0) {
      bctx.beginPath();
      bctx.moveTo(drawState.prevMid.x, drawState.prevMid.y);
      bctx.lineTo(drawState.prevPoint.x, drawState.prevPoint.y);
      bctx.stroke();
      drawState.prevMid = null;
    }
    drawState.drawing = false;
    drawState.snapshot = null;
    // 抠除后把背景补回透明区域：屏幕上不会露白，导出的图片也不会变黑
    if (drawState.tool === "erase-true") {
      bctx.globalCompositeOperation = "destination-over";
      bctx.drawImage(bgCanvas, 0, 0);
    }
    bctx.globalCompositeOperation = "source-over";
    smoothPoints = [];
  };

  // --- 自动平滑开关 ---
  $("board-smooth-btn").addEventListener("click", function () {
    smoothMode = !smoothMode;
    var sb = $("board-smooth-btn");
    sb.classList.toggle("active", smoothMode);
    sb.setAttribute("aria-pressed", smoothMode ? "true" : "false");
    sb.title = smoothMode ? "平滑线条：已开启（点击关闭）" : "平滑线条：已关闭（点击开启）";
    showBoardToast(smoothMode ? "平滑：开 〰" : "平滑：关 〰");
  });

  // --- 真擦除工具切换时提示 ---
  $("board-tools").addEventListener("click", function (e) {
    var b = e.target.closest(".tool-btn");
    if (!b) return;
    var tool = b.getAttribute("data-tool");
    commitPendingSticker();          // 换工具时把手上的素材落定
    boardCanvas.style.cursor = tool === "fill" ? "cell" : "crosshair";
    if (tool === "erase-true") showBoardToast("真擦除：抠掉像素");
    else if (tool === "rainbow") showBoardToast("🌈 彩虹笔");
    else if (tool === "star") showBoardToast("⭐ 喷星星");
    else if (tool === "heart") showBoardToast("💗 喷爱心");
    else if (tool === "fill") showBoardToast("🪣 油漆桶：点封闭区域填色");
  });

  // --- 清空按钮：用新 clearBoard ---
  $("board-clear").addEventListener("click", function () {
    pushHistory();
    applyBackground(currentTheme);
    resetBoardStats();
    showBoardToast("画布已清空");
  });

  // --- 保存 PNG ---
  $("board-save").addEventListener("click", function () {
    commitPendingSticker(function () {
      try {
        var dataUrl = boardCanvas.toDataURL("image/png");
        var a = document.createElement("a");
        a.href = dataUrl;
        a.download = "画一画-" + new Date().toLocaleDateString() + "-" + Math.floor(Math.random()*1000) + ".png";
        a.click();
        showBoardToast("💾 已下载");
      } catch (err) { showBoardToast("保存失败"); }
    });
  });

  // --- Toast 函数 ---
  function showBoardToast(msg) {
    var t = $("board-toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(function () { t.classList.remove("show"); }, 1500);
  }

  // --- 彩带 confetti ---
  function spawnBoardConfetti(n) {
    var emojis = ["🎉","🎊","✨","⭐","🏆","💖","🌟","🎈","🍬","💫","🌈","🎨"];
    for (var i = 0; i < n; i++) {
      var el = document.createElement("div");
      el.className = "bd-confetti";
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = (Math.random() * 100) + "%";
      el.style.animationDuration = (1.5 + Math.random() * 1.5) + "s";
      el.style.fontSize = (18 + Math.random() * 18) + "px";
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 3000);
    }
  }

  // --- 创作评分（纯本地启发式，分数不展示给孩子，只用来挑鼓励语） ---
  var boardStats = { strokes: 0, stickers: 0, colors: {}, tools: {} };

  function recordBoardAction(tool, color) {
    boardStats.tools[tool] = true;
    if (tool === "sticker") { boardStats.stickers++; return; }
    if (["pen", "rainbow", "star", "heart", "line", "rect", "circle", "eraser", "erase-true", "fill"].indexOf(tool) >= 0) {
      boardStats.strokes++;
      if (color) boardStats.colors[color] = true;
    }
  }

  function resetBoardStats() {
    boardStats = { strokes: 0, stickers: 0, colors: {}, tools: {} };
  }

  // 采样画布：内容占比 + 九宫格覆盖数
  function analyzeBoardPixels() {
    var w = boardCanvas.width, h = boardCanvas.height, img, d;
    try { img = bctx.getImageData(0, 0, w, h); d = img.data; } catch (e) { return { ratio: 0, cells: 0 }; }
    var bgHex = (THEMES[currentTheme] || THEMES.white).fill;
    var bg = hexToRgba(bgHex);
    var stride = 3, total = 0, content = 0;
    var cellTotal = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    var cellInk = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    var cw = w / 3, ch = h / 3;
    for (var y = 0; y < h; y += stride) {
      var cy = Math.min(2, Math.floor(y / ch));
      for (var x = 0; x < w; x += stride) {
        var i = (y * w + x) * 4;
        var diff;
        if (bgSnapshot) {
          diff = Math.abs(d[i] - bgSnapshot[i]) + Math.abs(d[i + 1] - bgSnapshot[i + 1]) + Math.abs(d[i + 2] - bgSnapshot[i + 2]);
        } else {
          diff = Math.abs(d[i] - bg[0]) + Math.abs(d[i + 1] - bg[1]) + Math.abs(d[i + 2] - bg[2]);
        }
        var cx = Math.min(2, Math.floor(x / cw));
        var ci = cy * 3 + cx;
        cellTotal[ci]++; total++;
        if (diff > 45) { content++; cellInk[ci]++; }
      }
    }
    var cells = 0;
    for (var k = 0; k < 9; k++) {
      if (cellTotal[k] && cellInk[k] / cellTotal[k] > 0.04) cells++;
    }
    return { ratio: total ? content / total : 0, cells: cells };
  }

  function scoreBoard() {
    var px = analyzeBoardPixels();
    var colorCount = Object.keys(boardStats.colors).length;
    var toolCount = Object.keys(boardStats.tools).length;
    var acts = boardStats.strokes + boardStats.stickers;

    var s1 = Math.min(colorCount, 5) / 5 * 20;                       // 丰富度
    var r = px.ratio;
    var s2 = r <= 0 ? 0 : (r < 0.10 ? (r / 0.10) * 14                 // 完成度
        : (r <= 0.55 ? 20 : Math.max(8, 20 - (r - 0.55) * 30)));
    var s3 = Math.min(acts, 12) / 12 * 20;                           // 结构
    var s4 = Math.min(toolCount, 5) / 5 * 20;                        // 变化
    var s5 = px.cells / 9 * 20;                                      // 平衡

    return {
      total: Math.round(s1 + s2 + s3 + s4 + s5),
      colorCount: colorCount, toolCount: toolCount, acts: acts,
      ratio: r, cells: px.cells, stickers: boardStats.stickers
    };
  }

  var PRAISE_LOW = [
    "你一直在认真画呀，真专心！",
    "每一笔都在变好，继续加油！",
    "慢慢画，你的画会越来越棒！"
  ];
  var PRAISE_MID = [
    "真棒！画面越来越丰富啦！",
    "你的画里藏着好多小想法！",
    "这个颜色配得真好看！"
  ];
  var PRAISE_HIGH = [
    "哇！这幅画好完整，像一个小故事，可以讲给我听吗？",
    "太厉害了！这是一幅完整的作品，我要给你鼓掌！",
    "小艺术家出手啦！画面又满又漂亮！"
  ];

  function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function buildEncouragement() {
    var sc = scoreBoard();
    if (sc.acts === 0 && sc.ratio < 0.005) {
      return { text: "画布还空着呢，先画点什么，我再来夸你～", score: sc };
    }
    if (sc.total >= 72) return { text: pickOne(PRAISE_HIGH), score: sc };
    if (sc.total >= 45) {
      var parts = [];
      if (sc.colorCount >= 3) parts.push("用了 " + sc.colorCount + " 种颜色");
      if (sc.acts >= 5) parts.push("画了 " + sc.acts + " 笔");
      if (sc.stickers > 0) parts.push("放了 " + sc.stickers + " 个小素材");
      if (parts.length) return { text: "真棒！你" + parts.join("、") + "，画面越来越丰富啦！", score: sc };
      return { text: pickOne(PRAISE_MID), score: sc };
    }
    return { text: pickOne(PRAISE_LOW), score: sc };
  }

  // --- Web Speech 朗读鼓励 ---
  $("board-speak").addEventListener("click", function () {
    var res = buildEncouragement();
    var text = res.text;
    showBoardToast("🔊 " + text);
    if (res.score.total >= 72) spawnBoardConfetti(12);
    if (!("speechSynthesis" in window)) return;
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = "zh-CN";
    utter.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  });

  // --- 初始化：模板渲染 + 预设配色重建 ---
  renderStickerGrid();
  rebuildColorSwatches("classic");
  applyBackground(currentTheme);

  // clearBoard 重写为使用当前主题背景（必须等 applyBackground 和 currentTheme 都定义好之后）
  clearBoard = function () { applyBackground(currentTheme); resetBoardStats(); };

  // 暴露给 console 调试（可选）
  window.__boardDebug = {
    stickers: STICKERS,
    select: function (name) {
      var s = STICKERS.find(function (x) { return x.name === name; });
      if (s) selectSticker(s);
    }
  };
})();
</script>
</body>
